name: Publish Marp slides

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build slides
        uses: docker://marpteam/marp-cli:latest
        with:
          args: src/slides.md --html --output public/presentation.html
        env:
          MARP_USER: root

      - name: Copy images
        run: sudo cp -r src/images public/images

      - name: Generate readable version
        run: python3 scripts/make_readable.py public/presentation.html public/index.html

      - name: Copy game
        run: sudo cp -r tokenspree public/tokenspree

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public