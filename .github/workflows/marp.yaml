name: Publish Marp slides

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build slides
        uses: docker://marpteam/marp-cli:latest
        with:
          args: src/slides.md --html --theme src/marp-theme.css --output public/presentation.html
        env:
          MARP_USER: root

      - name: Fix public/ ownership
        run: sudo chown -R runner public/

      - name: Copy layout.css
        run: cp src/layout.css public/layout.css

      - name: Install readable-version dependencies
        run: pip install markdown

      # Same script you run locally (scripts/build-readable.sh), so the
      # readable page is produced exactly one way: it syncs src/images into
      # public/ -- which the slideshow needs too -- and renders index.html.
      - name: Generate readable version and sync images
        run: scripts/build-readable.sh --no-open

      - name: Generate speaker notes companion page
        run: |
          python3 scripts/make_notes.py src/slides.md public/presentation.html public/notes.json
          cp src/notes.html public/notes.html

      - name: Copy game
        run: cp -r demo/tokenspree public/tokenspree

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public