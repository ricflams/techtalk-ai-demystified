name: Publish Marp slides

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build slides
        uses: docker://marpteam/marp-cli:latest
        with:
          args: src/slides.md --html --theme src/marp-theme.css --output public/presentation.html
        env:
          MARP_USER: root

      - name: Fix public/ ownership
        run: sudo chown -R runner public/

      - name: Copy images
        run: cp -r src/images public/images

      - name: Copy layout.css
        run: cp src/layout.css public/layout.css

      - name: Install readable-version dependencies
        run: pip install markdown

      - name: Generate readable version
        run: python3 scripts/make_readable.py src/slides.md public/index.html

      - name: Copy game
        run: cp -r demo/tokenspree public/tokenspree

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public