<h1 id="prologue">Prologue</h1>
<p>Over time, some tech things just trigger my brain like dopamine.</p>
<p>TODO: photos of my books</p>
<p>Years ago when HTML and XML came out I was like, man, I just want to know all about it.<br />
Or Java and then .NET, with bytecode and virtual bytecode-machines.</p>
<p>For the past yea I've felt that way about AI.<br />
Like a kid in a candy store.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-heading-divider="3" data-theme="d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4" lang="POSIX" data-marpit-pagination="3" style="--paginate:true;--heading-divider:3;--theme:d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4;" data-marpit-pagination-total="239">
<h3 id="a-eye-opening-insights">A eye opening insights</h3>
<p>TODO: image<br />
It's given me many eye-opening insights and a better grasp of AI that I wish for others to have too. There's rather a lot of mysticisim surrounding the bits of AI. Nearly daily at work I hear some misconception or myth.</p>
<p>That's the initiating? for this talk.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-heading-divider="3" data-theme="d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4" lang="POSIX" data-marpit-pagination="4" style="--paginate:true;--heading-divider:3;--theme:d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4;" data-marpit-pagination-total="239">
<h3 id="and-the-topic-is">And the topic is?</h3>
<p>TODO: image<br />
The topic is: All the foundational parts of AI. Not the math, don't worry. And not everything surrounding it, like the latest Claude slash-command. No, it's the steady? mechanisms and building blocks mental models that I amd at demystifying. Everything is still going to revolve around tokens and LLMs for the freseable future and their cost and limitations will still be around in a year - &quot;he said, over-confidently&quot;.</p>
<p>Maybe a bit like hearing about how a car works when all you want to do is take a camping-trip to Italy. But this can help you understand why the engine overheats in that slow queue up the mountain.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-heading-divider="3" data-theme="d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4" lang="POSIX" data-marpit-pagination="5" style="--paginate:true;--heading-divider:3;--theme:d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4;" data-marpit-pagination-total="239">
<h3 id="my-goal-is-for-everybody-to-level-up">My goal is for everybody to level-up</h3>
<p>TODO: image<br />
&quot;Is this for me?&quot;, you ask. Yes, it's for everybody, because everybody uses AI</p>
<p>My grand GOAL is &quot;demystifying the AI&quot;. I hope that you will all become more familiar with the terms and the fundamental principles of how the AI works so you're all better equipped to work with AI.</p>
<p>TODO: Image of checklist/bingo: tokens, embeddings, LLM, context, modes, thinking, MCP-servers, skills, agent-files - and more.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-heading-divider="3" data-theme="d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4" lang="POSIX" data-marpit-pagination="6" style="--paginate:true;--heading-divider:3;--theme:d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4;" data-marpit-pagination-total="239">
<h2 id="the-presentation">The presentation</h2>
<p>TODO: image<br />
How do I cram &quot;all of AI&quot; into one presentation? In particular on a topic you all know about and &quot;everybody&quot; is interested in. It would be so easy to just throw tecnical descriptions at you and expect it to stick. What made creating this presentation really challenging, but also really rewarding for me personally, has been figuring out all the details and how best to present them as a journey through the AI landscape that highlight the most relevant and useful bits. While keeping it appropriately deep and not tell you anything wrong. I've simplifed some aspects and some AI services likely does x and y a bit differently, but it's as correct as I could possibly make it.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-heading-divider="3" data-theme="d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4" lang="POSIX" data-marpit-pagination="7" style="--paginate:true;--heading-divider:3;--theme:d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4;" data-marpit-pagination-total="239">
<h3 id="ask-questions---now-and-later">Ask questions - now and later</h3>
<p>You may be thinking &quot;hang on, that can't be right&quot; or &quot;I don't get it!&quot;. Feel free to ask questions during the talk. And afterwards, go checkout the slides which are on github and has links to related materials. And not least: ask me or other colleagues if you've got questions. I'd be happy to elaborate on everything I'm presenting here today.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-heading-divider="3" data-theme="d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4" lang="POSIX" data-marpit-pagination="8" style="--paginate:true;--heading-divider:3;--theme:d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4;" data-marpit-pagination-total="239">
<h3 id="10000000-ai-videos-1">10,000,000 AI videos... +1</h3>
<img class="full" src="images/intro/youtube.png" />
<h4 id="why-this-presentation">Why this presentation?</h4>
<p>What can I possibly say that hasn't already been said in the 10,000,000 existing AI-related videos?<br />
Why not just post 10 links to the most popular videos about LLMs?</p>
<p>I guess for the same reason that you ask an AI about any topic instead of reading some of the 10,000,000 webpages about that topic: you get a personal, curated presentation that tells the story in a way I find insightful - hopefully presenting <strong>just the good bits</strong> from those 10,000,000 videos. Also, you can ask any questions you have.</p>
<p>There's a lot to go through. Let's go.</p>
</section>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-heading-divider="3" data-theme="d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4" lang="POSIX" data-marpit-pagination="11" style="--paginate:true;--heading-divider:3;--theme:d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4;" data-marpit-pagination-total="239">
<h2 id="what-is-the-ai">What is &quot;the AI&quot;?</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-heading-divider="3" data-theme="d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4" lang="POSIX" data-marpit-pagination="12" style="--paginate:true;--heading-divider:3;--theme:d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4;" data-marpit-pagination-total="239">
<h3 id="what-is-the-ai-you-speak-to">What is &quot;the AI&quot; you speak to?</h3>
<img class="full" src="images/definitions/hello/user-ai.png" />
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-heading-divider="3" data-theme="d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4" lang="POSIX" data-marpit-pagination="13" style="--paginate:true;--heading-divider:3;--theme:d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4;" data-marpit-pagination-total="239">
<h3 id="you-always-speak-via-an-assistant">You always speak via an assistant</h3>
<img class="full" src="images/definitions/hello/user-assistant-ai.png" />
<h4 id="-1"></h4>
<p>The assistant knows who you are and what your preferences are, if any. It adds extra context to every conversation you have with the AI itself.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-heading-divider="3" data-theme="d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4" lang="POSIX" data-marpit-pagination="14" style="--paginate:true;--heading-divider:3;--theme:d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4;" data-marpit-pagination-total="239">
<h3 id="finally-at-the-ai">Finally at &quot;the AI&quot;</h3>
<img class="full" src="images/definitions/hello/all.png" />
<h4 id="-2"></h4>
<p>The LLM (Large Language Model) is the brain of the operation. The LLM is functionally very, very simple - for example, it actually only says one word at a time and can't &quot;do&quot; anything. So it needs some extra surrounding functionality be really be useful, like be able to complete a full sentence, browse the web, read documents, etc. The AI service is that scaffolding.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-heading-divider="3" data-theme="d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4" lang="POSIX" data-marpit-pagination="15" style="--paginate:true;--heading-divider:3;--theme:d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4;" data-marpit-pagination-total="239">
<h3 id="the-assistant-steer-the-ai-on-your-behalf">The assistant steer the AI on your behalf</h3>
<img class="full" src="images/definitions/the-parts.png" />
<h4 id="-3"></h4>
<p>The assistant can also clinically be called an &quot;AI client&quot; and is also often called an &quot;AI agent&quot;, or slightly more correct an &quot;AI user agent&quot;. Just like how Outlook is an &quot;Email User Agent.</p>
<p>&quot;LLM&quot; and &quot;AI model&quot; are in practice synonymous.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-heading-divider="3" data-theme="d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4" lang="POSIX" data-marpit-pagination="16" style="--paginate:true;--heading-divider:3;--theme:d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4;" data-marpit-pagination-total="239">

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-heading-divider="3" data-theme="d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4" lang="POSIX" data-marpit-pagination="17" style="--paginate:true;--heading-divider:3;--theme:d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4;" data-marpit-pagination-total="239">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-heading-divider="3" data-theme="d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4" lang="POSIX" data-marpit-pagination="18" style="--paginate:true;--heading-divider:3;--theme:d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4;" data-marpit-pagination-total="239">
<h3 id="browser-and-terminal">Browser and terminal</h3>
<div class="cols">
<img class="full" src="images/definitions/arrangements/browser.png" />
<div>
<ul>
<li><em>Browse</em> to chatgpt.com, claude.com, ...</li>
<li>Chats and settings are <em>on the website</em></li>
<li>You can <em>do a lot</em>: chat, make images, documents, use online tools, etc</li>
</ul>
</div>
</div>
<br />
<div class="cols">
<img class="full" src="images/definitions/arrangements/cli.png" />
<div>
<ul>
<li><em>Install</em> claude, gemini, opencode, ...</li>
<li>Chats, settings, files - <em>all on your pc</em></li>
<li>Better <em>control of the AI</em></li>
<li><em>Text</em>, yes, but actually pretty nice</li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-heading-divider="3" data-theme="d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4" lang="POSIX" data-marpit-pagination="19" style="--paginate:true;--heading-divider:3;--theme:d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4;" data-marpit-pagination-total="239">

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-heading-divider="3" data-theme="d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4" lang="POSIX" data-marpit-pagination="20" style="--paginate:true;--heading-divider:3;--theme:d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4;" data-marpit-pagination-total="239">
<h3 id="other-options-in-service-and-self-hosted">Other options: in service and self-hosted</h3>
<div class="cols">
<img class="full" src="images/definitions/arrangements/app.png" />
<div>
<ul>
<li>Use AI <em>indirectly</em> via some application</li>
<li>Little to no control over the behavior</li>
<li>Chat-knowledge still comes in handy; e.g. you can often ask &quot;list your tools&quot;</li>
</ul>
</div>
</div>
<br />
<div class="cols">
<img class="full" src="images/definitions/arrangements/local.png" />
<div>
<ul>
<li>Run open-weight <em>full LLM</em> on your pc</li>
<li>Gives you <em>full control</em>, eg for <em>training</em></li>
<li>Need a pretty <em>powerful GPU, RAM</em></li>
<li>Is frankly often <em>over-hyped</em></li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-heading-divider="3" data-theme="d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4" lang="POSIX" data-marpit-pagination="21" style="--paginate:true;--heading-divider:3;--theme:d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4;" data-marpit-pagination-total="239">
<h3 id="my-own-progression">my own progression</h3>
<p>Started prompting<br />
Then producing code which I copy-pasted<br />
Started having the AI work on files in vscode<br />
Now I use terminal for anything related to code and files, web for just asking questions.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-heading-divider="3" data-theme="d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4" lang="POSIX" data-marpit-pagination="22" style="--paginate:true;--heading-divider:3;--theme:d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4;" data-marpit-pagination-total="239">
<img class="full" src="images/overview/full.png" />
<p>You, the <strong>human</strong>, use an <strong>AI Client</strong> to communicate with an <strong>AI Service</strong> that turn your messages into <strong>tokens</strong> and feed it through an <strong>LLM</strong>. The service and agent can use <strong>tools</strong> and the client can <strong>remember</strong>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-heading-divider="3" data-theme="d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4" lang="POSIX" data-marpit-pagination="23" style="--paginate:true;--heading-divider:3;--theme:d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4;" data-marpit-pagination-total="239">
<h2 id="what-is-eg-shared-for-claude">What is eg shared for Claude?</h2>
<p>enuinely shared</p>
<p>Authentication / identity. You log into Claude Code with the same Claude credentials. Your Pro or Max plan covers Claude Code, and you log in with the same Claude credentials you use in the terminal. Claude<br />
Usage quota. This is the big one. Both Pro and Max plans offer usage limits that are shared across Claude and Claude Code, meaning all activity in both tools counts against the same usage limits. It's one rolling-window + weekly pool; burning tokens in the CLI directly reduces what's left in chat. As of recently that same bucket also absorbs Cowork and Claude Design. Extra consumption now feeds a shared pool, so credits count interchangeably for design, chat, and code. ClaudePasquale Pillitteri<br />
Subscription entitlements (plan tier, model access, billing) — follows from the account.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-heading-divider="3" data-theme="d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4" lang="POSIX" data-marpit-pagination="24" style="--paginate:true;--heading-divider:3;--theme:d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4;" data-marpit-pagination-total="239">

<p>What's a client<br />
What's an agent</p>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-heading-divider="3" data-theme="d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4" lang="POSIX" data-marpit-pagination="25" style="--paginate:true;--heading-divider:3;--theme:d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4;" data-marpit-pagination-total="239">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-heading-divider="3" data-theme="d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4" lang="POSIX" data-marpit-pagination="27" style="--paginate:true;--heading-divider:3;--theme:d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4;" data-marpit-pagination-total="239">
<h2 id="ai-service-is-a-big-backend-service">AI Service is a big backend service</h2>
<p>Just like any big SaaS-company's services, it runs on some data center somewhere.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-marpit-fragments="4" data-paginate="true" data-heading-divider="3" data-theme="d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4" lang="POSIX" data-marpit-pagination="28" style="--paginate:true;--heading-divider:3;--theme:d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4;" data-marpit-pagination-total="239">
<h3 id="the-ai-service-after-richard-attenborough">The AI service, after Richard Attenborough</h3>
<ul>
<li data-marpit-fragment="1">The AI Service Lives in a huge airconditioned area that is ripe with cheap, reliable power, often near water.</li>
<li data-marpit-fragment="2">It's very intelligent but speak in a simple language, called JSON</li>
<li data-marpit-fragment="3">Maybe somewhat surprisingly, it really only does one thing: when you speak a sentence to it, it can predict how that sentence should continue.</li>
<li data-marpit-fragment="4">It has aqcuired that impressive skill by intensely studying and absorbing everything written in every language at an unfathomably large scale.</li>
</ul>
<p>Let's take a peek into the brain of that little fellow. It takes its name after that capability: the Large Language Model, the LLM.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-heading-divider="3" data-theme="d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4" lang="POSIX" data-marpit-pagination="29" style="--paginate:true;--heading-divider:3;--theme:d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4;" data-marpit-pagination-total="239">
<h2 id="ai-data-center">AI Data center</h2>
<img src="images/intro/datacenter.jpg" />
<h4 id="-4"></h4>
<p>The commercial <strong>AI Services</strong> run in massive data centers.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-heading-divider="3" data-theme="d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4" lang="POSIX" data-marpit-pagination="30" style="--paginate:true;--heading-divider:3;--theme:d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4;" data-marpit-pagination-total="239">

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-heading-divider="3" data-theme="d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4" lang="POSIX" data-marpit-pagination="32" style="--paginate:true;--heading-divider:3;--theme:d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4;" data-marpit-pagination-total="239">
<h2 id="llm-is-the-generative-ai">LLM is the generative AI</h2>
<img class="full" src="images/overview/llm-intro.png" />
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-heading-divider="3" data-theme="d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4" lang="POSIX" data-marpit-pagination="33" style="--paginate:true;--heading-divider:3;--theme:d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4;" data-marpit-pagination-total="239">
<h2 id="the-core-idea">The Core Idea</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-heading-divider="3" data-theme="d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4" lang="POSIX" data-marpit-pagination="34" style="--paginate:true;--heading-divider:3;--theme:d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4;" data-marpit-pagination-total="239">
<h3 id="ai-model-%E2%A9%B5-llm">AI model ⩵ LLM</h3>
<p>Our focus is on <strong>AI models</strong> that generate text. Not images, audio, etc.</p>
<p>All such modern AI models are built as a <strong>Large Language Model</strong>, aka an <strong>LLM</strong>.</p>
<p>In practice the words are synonymous: <strong>AI Model ⩵ LLM</strong></p>
<br />
<img class="half" src="images/core/ai-model.svg" />
<h4 id="-5"></h4>
<p>I tend to often use the word &quot;LLM&quot; when pointing to a specific box on a diagram or technical details and &quot;the AI model&quot; when talking about its behavior, but it varies.</p>
<p>If we're nitpicking the synonym-claim then yeah, it more correct to say that &quot;an LLM is an AI model&quot; and &quot;all the current AI models used for generating text (ChatGPT, Claude, Gemini, etc) are LLMs&quot;.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-heading-divider="3" data-theme="d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4" lang="POSIX" data-marpit-pagination="35" style="--paginate:true;--heading-divider:3;--theme:d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4;" data-marpit-pagination-total="239">
<h3 id="just-a-fancy-autocomplete-is-true">&quot;Just a fancy autocomplete&quot; is ...true</h3>
<img class="full" src="images/core/calculator-once-upon.png" />
<br />
<img class="half" src="images/core/ai-model-in-out.svg" />
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-heading-divider="3" data-theme="d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4" lang="POSIX" data-marpit-pagination="36" style="--paginate:true;--heading-divider:3;--theme:d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4;" data-marpit-pagination-total="239">
<h3 id="not-answers-most-probable-prediction">Not answers; &quot;most probable prediction&quot;</h3>
<ul>
<li>
<p>The LLM can do <em>just one thing</em>: it has seen so much text that it can <em>predict the most likely next word</em> in any context.</p>
</li>
<li>
<p>That means <em>the context is everything</em>. It's the only thing the model sees, and every word in it <em>pulls the model's prediction</em> in some direction based on trained patterns.</p>
</li>
<li>
<p>So you don't &quot;tell the LLM what to do&quot;: you build the context so that <em>what you want to come next</em> becomes the model's <em>most likely prediction</em>.<br />
<br /><br />
<img class="half" src="images/core/ai-model-in-out.svg" /></p>
</li>
</ul>
</section>

<h3 id="not-easy---human-brain">Not easy - human brain</h3>
<p>That doesn't mean that it's easy to produce such a machine, or that what it does is not a great feat. It only speaks about what it actually does - how it operates, not just &quot;at its core&quot; but at all.</p>
<p>None of this means LLMs are simple to build, or that what they do isn't remarkable. It's a description of what they do — not just &quot;at their core,&quot; but at all.</p>
<p>I'm not saying this is &quot;earth shattering revelations&quot; but I can sense that often this knowledge grounds me in a better understanding of how to shape the context.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-heading-divider="3" data-theme="d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4" lang="POSIX" data-marpit-pagination="42" style="--paginate:true;--heading-divider:3;--theme:d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4;" data-marpit-pagination-total="239">
<h3 id="steering-the-context">Steering the context</h3>
<p>Words go into context with the intent of steering the next prediction toward what's useful for you. That's the whole game.</p>
<p>The model has no other input to go by for dealing with your tasks than the context you give it. So how do</p>
<p>&quot;Everything we just looked at — the social script, the authority register, the thinking trigger — is the same trick from a different angle. Tokens go into context with the intent of steering the next prediction toward what's useful. That's the whole game. The model has no other input, no other lever, no other faculty. Which means if you understand what's in the context and why each piece is there, you understand what the model is going to do. And if you understand that, you understand why prompt injection works, why agents need careful prompting, why thinking helps, why long contexts degrade — every interesting property of these systems flows from the same fact: the only knob is the tokens in the window, and somebody is always deciding which ones go in.&quot;</p>
</section>

<h3 id="tokens-summarized">Tokens, summarized</h3>
<ul>
<li data-marpit-fragment="1">A <strong>token</strong> is the <strong>chunk of text</strong> the AI service can reason about</li>
<li data-marpit-fragment="2">Models typically have a <strong>vocabulary</strong> of 200,000 tokens</li>
<li data-marpit-fragment="3">For English, 1 token is roughly 1 word<br />
<br /><br />
And last, but not least:<br />
<br /></li>
<li data-marpit-fragment="4">AI services <strong>charges per token</strong>, since tokens are the unit the LLM works on<br />

</ul>
<h4 id="-17"></h4>
<p>For English, one token generally corresponds to about 4 characters. For a text the number of tokens will typically be 30% higher than the number of words, ie 1000 words means 1300 tokens - broadly speaking.</p>

<h3 id="%E2%9A%A0%EF%B8%8F-warning-%E2%9A%A0%EF%B8%8F"><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> Warning <img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/></h3>
<p>This will sound confusing</p>
<p>Stay with me.</p>
<p>Computers don't understand the word &quot;cat.&quot; They understand numbers. So we need a way to turn &quot;cat&quot; into numbers in a way that preserves its meaning. That's what an embedding does.</p>
<img class="half" src="images/embedding/confused.png" />
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="66" data-paginate="true" data-heading-divider="3" data-theme="d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4" lang="POSIX" data-marpit-pagination="66" style="--paginate:true;--heading-divider:3;--theme:d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4;" data-marpit-pagination-total="239">
<h3 id="an-embedding-is-a-thing-not-an-action">An &quot;embedding&quot; is a thing, not an action</h3>
<img class="full" src="images/embedding/bicycle-tree.jpg" />
<h4 id="notes">Notes</h4>
<p>In everyday English, &quot;embedding&quot; sounds like something you do: the act of placing something into something else.</p>
<p>In AI, it means the concrete vector of numbers that <em>somehow</em> represent the characteristics of something. It's a noun, not a verb. It's a &quot;thing&quot;, not something that &quot;happens&quot;.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="67" data-paginate="true" data-heading-divider="3" data-theme="d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4" lang="POSIX" data-marpit-pagination="67" style="--paginate:true;--heading-divider:3;--theme:d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4;" data-marpit-pagination-total="239">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="70" data-paginate="true" data-heading-divider="3" data-theme="d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4" lang="POSIX" data-marpit-pagination="70" style="--paginate:true;--heading-divider:3;--theme:d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4;" data-marpit-pagination-total="239">
<h3 id="the-meaning-of--anything">The meaning of ... &quot;anything&quot;?</h3>
<img class="full" src="images/embedding/20d-blank.svg" />
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="71" data-paginate="true" data-heading-divider="3" data-theme="d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4" lang="POSIX" data-marpit-pagination="71" style="--paginate:true;--heading-divider:3;--theme:d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4;" data-marpit-pagination-total="239">
<h3 id="yes-the-meaning-of-anything">Yes, the meaning of &quot;anything&quot;</h3>
<img class="full" src="images/embedding/20d-with-tokens.svg" />
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="72" data-paginate="true" data-heading-divider="3" data-theme="d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4" lang="POSIX" data-marpit-pagination="72" style="--paginate:true;--heading-divider:3;--theme:d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4;" data-marpit-pagination-total="239">
<h3 id="embedding-a-meanings-characteristics">Embedding: a meaning's characteristics</h3>
<div class="cols">
<div>
	<img src="images/embedding/20d-kitten.png" />
</div>
<div class="col-6">
<p>An <strong>embedding</strong> is a list of numbers (also called a <strong>vector</strong> or <strong>tensor</strong>) that <em>somehow</em> characterises <em>something</em>.</p>
<p>The number of nuances, characteristics, we decide to use is called the embedding's <strong>dimension</strong>. If &quot;kitten&quot; is described by 20 characteristics then the embedding of &quot;kitten&quot; has 20 dimensions. Each number is called the <strong>weight</strong> of that dimension.</p>
<p>Embeddings can be: Any <em>word</em> you know. Any <em>sentence</em> there exist. Any <em>feeling</em> you can have. Any <em>concept</em>, including e.g. <em>a curious yet mildly confused audience</em>.</p>
</div>
</div>
<img class="full" src="images/embedding/20d-with-tokens.svg" />
<h4 id="-18"></h4>
<p>Also called <em>tensor</em> in python, or <em>hidden state</em> when speaking about the LLM.</p>
<p><em>&quot;Somehow&quot;</em>, because we don't know what &quot;features/traits/aspects&quot; the dimensions corresponds to. We can't say where the &quot;heavy&quot; dimension is and the numbers themselves also only make sense to the LLM.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="73" data-marpit-fragments="14" data-paginate="true" data-heading-divider="3" data-theme="d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4" lang="POSIX" data-marpit-pagination="73" style="--paginate:true;--heading-divider:3;--theme:d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4;" data-marpit-pagination-total="239">
<h3 id="more-of-anything-imaginable">More of &quot;anything imaginable&quot;</h3>
<div class="cols">
<div>
<ul>
<li data-marpit-fragment="1">The concept of the number 7</li>
<li data-marpit-fragment="2">Loneliness in a crowded place</li>
<li data-marpit-fragment="3">The entire first <em>Harry Potter</em> book</li>
<li data-marpit-fragment="4">A single chess position mid-game</li>
<li data-marpit-fragment="5">The smell of rain on hot asphalt</li>
<li data-marpit-fragment="6">A user's purchases on a website</li>
<li data-marpit-fragment="7">A protein's amino acid sequence</li>
</ul>
</div>
<div>
<ul>
<li data-marpit-fragment="8">The grammatical role &quot;indirect object&quot;</li>
<li data-marpit-fragment="9">The concept of sarcasm <em>(yeah, right)</em></li>
<li data-marpit-fragment="10">What &quot;London-ness&quot; feels like</li>
<li data-marpit-fragment="11">A function's behavior in a codebase</li>
<li data-marpit-fragment="12">A legal precedent in criminal law</li>
<li data-marpit-fragment="13">The notion of &quot;almost, but not quite&quot;</li>
<li data-marpit-fragment="14">What 3 a.m. feels like</li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="74" data-paginate="true" data-heading-divider="3" data-theme="d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4" lang="POSIX" data-marpit-pagination="74" style="--paginate:true;--heading-divider:3;--theme:d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4;" data-marpit-pagination-total="239">
<h3 id="this-would-be-embeddings-for-all-words">This would be embeddings for all words</h3>
<img class="full" src="images/embedding/vocabulary-a-z.png" />
<h4 id="-19"></h4>
<p>Conceptually, every word has an embedding that captures its meaning. This is not entirely correct because we are of course always dealing with tokens, not words - so the vocabulary of an LLM has embeddings for every token instead of words.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="75" data-paginate="true" data-heading-divider="3" data-theme="d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4" lang="POSIX" data-marpit-pagination="75" style="--paginate:true;--heading-divider:3;--theme:d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4;" data-marpit-pagination-total="239">
<h3 id="in-reality-an-embedding-for-every-token">In reality, an embedding for every token</h3>
<img class="full" src="images/embedding/vocabulary-gpt-3.png" />
<p>ChatGPT 3 has <em>50,257 tokens</em>, each described by <em>12,288 dimensions</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="76" data-paginate="true" data-heading-divider="3" data-theme="d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4" lang="POSIX" data-marpit-pagination="76" style="--paginate:true;--heading-divider:3;--theme:d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4;" data-marpit-pagination-total="239">
<h2 id="the-embeddings-where-do-they-come-from">The embeddings, where do they come from?</h2>
<p>We'll get to that later</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="77" data-marpit-fragments="3" data-paginate="true" data-heading-divider="3" data-theme="d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4" lang="POSIX" data-marpit-pagination="77" style="--paginate:true;--heading-divider:3;--theme:d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4;" data-marpit-pagination-total="239">
<h3 id="the-examples-embeddings">The example's embeddings</h3>
<img class="full" src="images/embedding/embedding-matrix.png" />
<h4 id="-20"></h4>
<p>Also sometimes called as &quot;features&quot;, as each value in the vector encodes some learned semantic trait of the token. Like eg &quot;catness&quot; or &quot;largeness&quot;.</p>
<p>In practice though we simply don't know what those dimensions mean. They don't map crisply to existing human concepts. Dimension 847 might contribute a little to formality, a little to temporal reference, a little to something related to food, and a lot to some abstract statistical regularity that doesn't map to any word in English.</p>
<p>There's a research field called mechanistic interpretability that tries to decompose these representations into interpretable directions. They can extract interpretable features, but understanding how features compose to produce behavior is still largely unsolved.</p>
<ul>
<li data-marpit-fragment="1"><a href="https://learnmechinterp.com/topics/scaling-monosemanticity/">Scaling Monosemanticity and Feature Steering</a></li>
<li data-marpit-fragment="2"><a href="https://www.anthropic.com/research/emotion-concepts-function">Emotion concepts and their function in a large language model</a></li>
<li data-marpit-fragment="3"><a href="https://www.youtube.com/watch?v=9-Jl0dxWQs8">How might LLMs store facts | Deep Learning Chapter 7 (3Blue1Brown)</a></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="78" data-paginate="true" data-heading-divider="3" data-theme="d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4" lang="POSIX" data-marpit-pagination="78" style="--paginate:true;--heading-divider:3;--theme:d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4;" data-marpit-pagination-total="239">
<h3 id="the-llm-is-all-about-math-on-embeddings">The LLM is all about math on embeddings</h3>
<img class="full" src="images/llm/overview-embeddings.png" />
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="79" data-paginate="true" data-heading-divider="3" data-theme="d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4" lang="POSIX" data-marpit-pagination="79" style="--paginate:true;--heading-divider:3;--theme:d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4;" data-marpit-pagination-total="239">
<h2 id="the-llm-1">The LLM</h2>
<img class="full" src="images/overview/llm.png" />
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="80" data-paginate="true" data-heading-divider="3" data-theme="d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4" lang="POSIX" data-marpit-pagination="80" style="--paginate:true;--heading-divider:3;--theme:d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4;" data-marpit-pagination-total="239">
<h3 id="the-llm-2">The LLM</h3>
<p>The LLM is all about <strong>math</strong> and <strong>statistics</strong>.<br />
<br /><br />
It does <strong>inference</strong> by running the embeddings in the <strong>context</strong> through a giant <strong>neural network</strong>. After billions of calculations the result is: <em>&quot;what token likely comes next?&quot;</em><br />
<br /><br />
Because surprisingly: on a <em>very large scale</em>, you can <strong>do math on language</strong>.<br />
<br /><br />
The LLM is really the only part of the AI that can <em>&quot;think&quot;</em>. When you hear <em>&quot;it decides&quot;</em> or <em>&quot;only what is needed&quot;</em> then yes, the LLM is what produced that decision.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="81" data-paginate="true" data-heading-divider="3" data-theme="d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4" lang="POSIX" data-marpit-pagination="81" style="--paginate:true;--heading-divider:3;--theme:d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4;" data-marpit-pagination-total="239">
<img class="full" src="images/llm/no-math.jpg" />
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="82" data-paginate="true" data-heading-divider="3" data-theme="d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4" lang="POSIX" data-marpit-pagination="82" style="--paginate:true;--heading-divider:3;--theme:d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4;" data-marpit-pagination-total="239">
<h3 id="recap-our-example-xxxxx">Recap our example xxxxx</h3>
<p>The <strong>context</strong> is the input given to the LLM - here, 10 tokens<br />
The <strong>context window</strong> is the longest input the LLM can handle; 200K-1M<br />
<br /></p>
<img class="full" src="images/llm/what-is-an-llm-example.png" />
<h4 id="-21"></h4>
<p>Two things to note here:</p>
<p>Why only <code>An</code>? Why not the full answer? Yeah, hold your horses just a bit longer, because: the LLM only deals with producing one next token. That's all it is concerned about: figuring out with which <em>probablility</em> any of the tokens is the vocabulary has for being the next token.</p>
<p>That's the second thing to note: the LLM itself actually just produce this set of probabilities. The mechanism that actually <em>picks that next token</em> is strictly speaking outside the LLM. Let's include it here to convey that the outcome eventually is a token, namely <code>An</code> in this case.</p>
<h4 id="-22"></h4>
<p><a href="https://www.youtube.com/watch?v=LPZh9BOjkQs">Large Language Models explained briefly - 3Blue1Brown</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="83" data-paginate="true" data-heading-divider="3" data-theme="d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4" lang="POSIX" data-marpit-pagination="83" style="--paginate:true;--heading-divider:3;--theme:d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4;" data-marpit-pagination-total="239">
<h3 id="a-neural-network">A neural network</h3>
<img class="full" src="images/llm/neural-network.webp" />
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="84" data-paginate="true" data-heading-divider="3" data-theme="d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4" lang="POSIX" data-marpit-pagination="84" style="--paginate:true;--heading-divider:3;--theme:d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4;" data-marpit-pagination-total="239">

<img class="full" src="images/llm/neural-network-paris.webp" />
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="85" data-paginate="true" data-heading-divider="3" data-theme="d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4" lang="POSIX" data-marpit-pagination="85" style="--paginate:true;--heading-divider:3;--theme:d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4;" data-marpit-pagination-total="239">
<h3 id="the-llms-objective-whats-the-next-token">The LLM's objective: what's the next token?</h3>
<img class="full" src="images/llm/find-the-next-token.png" />
<h4 id="-23"></h4>
<p>The very observant reader may spot something unexpected. I claimed that each token's embedding was a fixed vector. But why do the two instances of &quot;you&quot; then not have the same embedding-values?</p>
<p>That's because the transformer initially instill some positional information (1, 2, 3, ...) into each individual embedding, typically using <em>RoPE</em> (Rotary Position Embeddings) which &quot;rotates&quot; the vector in 2D spaces in each layer.</p>
<p>Surprisingly, changing the vector values does not remove any of the embedding's &quot;meaning&quot; in the high-dimensional space. It retains its core conceptual meaning, only nudged a little bit.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="86" data-paginate="true" data-heading-divider="3" data-theme="d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4" lang="POSIX" data-marpit-pagination="86" style="--paginate:true;--heading-divider:3;--theme:d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4;" data-marpit-pagination-total="239">
<h3 id="probabilities-for-tokens-following-you">Probabilities for tokens following &quot;you&quot;</h3>
<p>&quot;That which does not kill you only makes you <em>can</em>&quot; - hmmm, hang on</p>
<img class="full" src="images/llm/next-token-after-you.svg" />
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="87" data-paginate="true" data-heading-divider="3" data-theme="d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4" lang="POSIX" data-marpit-pagination="87" style="--paginate:true;--heading-divider:3;--theme:d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4;" data-marpit-pagination-total="239">
<h3 id="enter-the-transformer-in-2017">Enter: The Transformer, in 2017</h3>
<img class="full" src="images/llm/the-transformer.png" />
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="88" data-paginate="true" data-heading-divider="3" data-theme="d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4" lang="POSIX" data-marpit-pagination="88" style="--paginate:true;--heading-divider:3;--theme:d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4;" data-marpit-pagination-total="239">
<h3 id="attention-is-all-you-need">&quot;Attention is all you need&quot;</h3>
<div class="cols">
<img class="full" src="images/llm/attention-is-all-you-need.png" />
<img class="full" src="images/llm/attention-transformer.png" />
</div>
<h4 id="-24"></h4>
<p>The 2017 paper &quot;Attention Is All You Need&quot; by Vaswani et al. is arguably the most consequential piece of computer science research published in the 21st century.</p>
<p>Today, the paper sits at over 200,000 citations, making it an absolute statistical anomaly in scientific literature.</p>
<p>It is the Genesis block of modern AI. Without it, there is no GPT-4, no Gemini, no Claude, no Stable Diffusion, and no AlphaFold. It transformed AI from an academic field of hyper-specialized, rigid pipelines into a unified era of generalized foundation models.</p>
<p><a href="https://proceedings.neurips.cc/paper_files/paper/2017/file/3f5ee243547dee91fbd053c1c4a845aa-Paper.pdf">Attention Is All You Need</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="89" data-paginate="true" data-heading-divider="3" data-theme="d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4" lang="POSIX" data-marpit-pagination="89" style="--paginate:true;--heading-divider:3;--theme:d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4;" data-marpit-pagination-total="239">
<h3 id="the-transformer-can-figure-this-out">The Transformer can figure this out:</h3>

</section>

<h3 id="first-all-embeddings-pay-attention">First, all embeddings &quot;pay attention&quot;</h3>
<img class="full" src="images/llm/attention-head.png" />
<h4 id="-25"></h4>
<p>Every embedding gets influenced by every embedding token before it. They &quot;absorb&quot; the meaning of all those other embedding, influenced also by the position. So the first &quot;you&quot; and the second &quot;you&quot; come from the same token, yes, but by virtue of their position they don't carry the same meaning, i.e. they don't start out as the same embedding-values.</p>
<p>For a full 1M context-window this means that up all 1 million embeddings pays attention to every other of the 1 million embeddings before it. That's the order of a million times a million calculations.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="92" data-paginate="true" data-heading-divider="3" data-theme="d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4" lang="POSIX" data-marpit-pagination="92" style="--paginate:true;--heading-divider:3;--theme:d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4;" data-marpit-pagination-total="239">

<h3 id="find-next-token-by-similarity-comparison">Find next token by similarity-comparison</h3>
<p>Also known as &quot;cosine similarity&quot;</p>
<p>Score all tokens in the vocabulary (1-200,000 tokens)</p>
<img class="full" src="images/llm/next-token-prediction.svg" />
<h4 id="-32"></h4>
<p>The cosine similarity of 0.97 is computed in isolation — it's purely a geometric measurement between two vectors, with no knowledge of the other 127,999 tokens. The 91% is a different kind of number entirely: it's the result of a competition. Softmax takes all 128,000 similarity scores simultaneously, exponentiates each one, and divides by their sum. Every token competes against every other token at once. &quot;Stronger&quot; claimed 91% of the total probability mass — not because 0.97 is intrinsically high, but because it pulled far enough ahead of the field. A high cosine similarity is the evidence. The probability is the verdict.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="100" data-paginate="true" data-heading-divider="3" data-theme="d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4" lang="POSIX" data-marpit-pagination="100" style="--paginate:true;--heading-divider:3;--theme:d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4;" data-marpit-pagination-total="239">

<h3 id="tokens-are-really-generated-one-by-one">Tokens are really generated one by one</h3>
<p>That's why output tokens are typically <em>5 x more expensive</em> than input tokens.<br />
<br /></p>
<img class="full" src="images/llm/tokenized-output.png" />
<h4 id="-34"></h4>
<p>This is what really boggles my mind. Each token is generated completely independently, only by choosing the most likely next word to come after what has already been seen now. There is no planning.</p>
<p>There's no plan to &quot;bold&quot; a word by emitting <code>** something **</code>. Instead at one point an <code> **</code> is emitted and later on another <code>**</code> is emitted.</p>
<p>There's no planning of emitting an itemized list. At one point a <code>1</code> is emitted and then a <code>.</code> and that cause the likelyhood pattern-wise of a later <code>2</code> and <code>.</code> to occur to rise significantly. But it happens independently without any overall grand design or planning.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="106" data-paginate="true" data-heading-divider="3" data-theme="d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4" lang="POSIX" data-marpit-pagination="106" style="--paginate:true;--heading-divider:3;--theme:d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4;" data-marpit-pagination-total="239">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="127" data-paginate="true" data-heading-divider="3" data-theme="d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4" lang="POSIX" data-marpit-pagination="127" style="--paginate:true;--heading-divider:3;--theme:d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4;" data-marpit-pagination-total="239">
<h3 id="are-all-ai-models-the-same">Are all AI models the same?</h3>
<img class="full" src="images/training/chatgpt-lingo.png" />
<h4 id="-37"></h4>
<p>Admittedly I coached ChatGPT into dialing up its &quot;chatgppt-ness&quot; to the max before asking this question. And honestly? It worked.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="128" data-marpit-fragments="3" data-paginate="true" data-heading-divider="3" data-theme="d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4" lang="POSIX" data-marpit-pagination="128" style="--paginate:true;--heading-divider:3;--theme:d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4;" data-marpit-pagination-total="239">
<h3 id="how-models-are-trained">How models are trained</h3>
<img class="full" src="images/training/training.png" />
<h4 id="-38"></h4>
<ul>
<li data-marpit-fragment="1">Base training - the &quot;auto-complete&quot; <em>facts</em></li>
<li data-marpit-fragment="2">Alignment learning - the <em>values</em></li>
<li data-marpit-fragment="3">Fine-tuning / RAG - the <em>specialization</em></li>
</ul>
<p>Pretraining is where the model learns language itself. Fed vast amounts of text, it learns to predict the next token — nothing more. The result is a powerful but raw capability: it knows how language works, how facts relate, how arguments are structured. It has no personality, no values, no sense of what a &quot;good&quot; response looks like.</p>
<p>Supervised Fine-Tuning (SFT) and Reinforcement Learning is where the model learns what good means to its creators. Humans or AI (RLHF or RLAIF) evaluators compare outputs and rank them. The model is iteratively shaped toward preferred behavior — this is where values, tone, refusal behaviors, and personality get baked in.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="129" data-paginate="true" data-heading-divider="3" data-theme="d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4" lang="POSIX" data-marpit-pagination="129" style="--paginate:true;--heading-divider:3;--theme:d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4;" data-marpit-pagination-total="239">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="138" data-marpit-fragments="3" data-paginate="true" data-heading-divider="3" data-theme="d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4" lang="POSIX" data-marpit-pagination="138" style="--paginate:true;--heading-divider:3;--theme:d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4;" data-marpit-pagination-total="239">
<h3 id="reinforcement-learning-by-feedback">Reinforcement Learning by Feedback</h3>
<p><strong>RLHF</strong> - Reinforcement Learning from <em>Human Feedback</em> (declining)<br />
<strong>RLAIF</strong> - Reinforcement Learning from <em>AI Feedback</em> (growing)<br />
<br /></p>
<img class="full" src="images/training/reinforcement-training-trend.png" />
<h4 id="-40"></h4>
<p>Frontier labs almost universally outsource the bulk of RLHF annotation rather than hiring raters directly. The main intermediaries:</p>
<ul>
<li data-marpit-fragment="1">Scale AI / Outlier — the dominant player, operating as an end-to-end data engine. Outlier handles LLM annotation, Remotasks handles visual/multimodal work. Scale is OpenAI's preferred fine-tuning partner and has also worked with Meta, Google DeepMind, and others. Taskmonk AI</li>
<li data-marpit-fragment="2">Surge AI — Anthropic's primary RLHF provider, with ~50,000 expert contractors. Also used by OpenAI and Meta. Taskmonk AI</li>
<li data-marpit-fragment="3">Invisible — shifted from executive VA services to RLHF work for labs including Microsoft, Cohere, and Mistral. Routes model outputs through trained raters who score completions and rank outputs. Sacra</li>
</ul>
<p>Outlier alone runs a network of 700,000+ contractors globally. The work is heavily gig-economy in structure.</p>
<p>Pay ranges from $15/hr for generalist annotators up to $500+/hr for domain experts like medical fellows and legal professionals. Invisible charges labs $30–45/hr for annotation work while paying raters $15–20/hr.</p>
<p>Each major frontier AI lab spends approximately $1 billion per year on human-generated training data, according to a 2025 Time Magazine investigation.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="139" data-paginate="true" data-heading-divider="3" data-theme="d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4" lang="POSIX" data-marpit-pagination="139" style="--paginate:true;--heading-divider:3;--theme:d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4;" data-marpit-pagination-total="239">

<h3 id="are-models-different-yes">Are models different? Yes</h3>
<br />
<img class="full" src="images/training/model-behavior.png" />
<br />
<ul>
<li data-marpit-fragment="1">Anthropic wants Claude to <em>reason from principles</em> — no rulebook needed</li>
<li data-marpit-fragment="2">OpenAI wants ChatGPT to <em>follow their spec</em> — rules written down explicitly</li>
<li data-marpit-fragment="3">Google wants Gemini to <em>behave correctly</em> — but via unpublished rules</li>
<li data-marpit-fragment="4">Meta wants Llama <em>powerful and open</em> — open weights, few restrictions</li>
<li data-marpit-fragment="5">Mistral wants Vibe <em>capable, open, and European</em> —  compliant, not principled</li>
<li data-marpit-fragment="6">DeepSeek wants its models <em>helpful and harmless</em> — as defined by the state</li>
<li data-marpit-fragment="7">xAI wants Grok to <em>tell the truth</em> — no censorship, no moralizing, no wokeness</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="146" data-paginate="true" data-heading-divider="3" data-theme="d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4" lang="POSIX" data-marpit-pagination="146" style="--paginate:true;--heading-divider:3;--theme:d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4;" data-marpit-pagination-total="239">

<br /></p>
<img class="full" src="images/training/claude-family.png" />
<h4 id="-43"></h4>
<p>For example, the Claude family are physically three different models: different size, training, speed, cost, strengths.</p>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="147" data-paginate="true" data-heading-divider="3" data-theme="d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4" lang="POSIX" data-marpit-pagination="147" style="--paginate:true;--heading-divider:3;--theme:d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4;" data-marpit-pagination-total="239">
<h2 id="llm-recap">LLM recap</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="148" data-paginate="true" data-heading-divider="3" data-theme="d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4" lang="POSIX" data-marpit-pagination="148" style="--paginate:true;--heading-divider:3;--theme:d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4;" data-marpit-pagination-total="239">
<h3 id="-44"></h3>
<p>TODO: a soft mental schematic</p>
<p>The purpose, recapped: You give it a string of tokens, aka the <em>context</em>, and it will produce a response based on the model's baked-in training by running that context through the Transformer. Pure math and trained knowledge. The LLM can only reason about what's in the context.</p>
<p>That is <em>all</em> it can do. It can't browse the web, multiply two large numbers, read a file, remember anything about you, no nothing. It can only - let's repeat: run the context through the Transformer to produce a response.</p>
<p>It's static, constant, and fixed on the day it was completed. The weights never changes. As a user you can't make it think differently or think &quot;harder&quot; or learn it something new or train it or have it remember anything. It only knows what was known the day its training was concluded.</p>
<p>A successor tech for LLMs is not around the corner. There's work being done with &quot;X of experts&quot; but generally the work continue to be N^2 for N context-length because of all the attention, so 1) we can't just keep cranking up the context window (source?) and 2) the cost will likely stay somehow &quot;per token&quot;. So if we want to do more with the same toolset (context window) then we need to explore smarter ways of managing the context and those tokens.</p>
<p>Called a Foundation Model because it can be used for all kinds of things without further specializing. You can fine-tune a FM but it's not all that simple - much much simpler and safer to simply give it a prompt.</p>
<h4 id="-45"></h4>
<p>When you hear somebody say &quot;then we can just fine-tune the model&quot; you should pack a fair amount of skepticism because you can only do that for certain models and it's not as easy as it might seem. TODO: Who would fine-tune a model?</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="149" data-paginate="true" data-heading-divider="3" data-theme="d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4" lang="POSIX" data-marpit-pagination="149" style="--paginate:true;--heading-divider:3;--theme:d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4;" data-marpit-pagination-total="239">
<h3 id="takeaways">Takeaways</h3>
<p>It's all statistics: All the words influence each other, absorb meaning from each other.</p>
<p>No dictionaries, no lookup of facts, no language translations. No learning.</p>
<p>No strict rules. Just statistical math. This means no guarantees (actually you can't even run the same input and be guaranteed to get the same output), not enforcement, no rules. whatever text is most convincing or authoritative wins. the most probable continuation given the training distribution. It's not a battle but a likelihood contest</p>
<p>&quot;no secret modes or unlock codes&quot;. No unlocking. Just. Math.</p>
<p>What's it good at:</p>
<p>Pattern recognition and analogy — &quot;this looks like that&quot; .</p>
<p>Arithmetic and counting — no calculator inside; &quot;17 × 23&quot; is answered by what such answers usually look like.<br />
the model answers &quot;what does text about counting r's in strawberry usually look like?&quot; — not &quot;how many r's are there?&quot;</p>
<p>Anything that requires understanding the content or meaning of what's in the context is the model's decision. Anything that can be evaluated against a fixed rule without understanding content is the client's. The client enforces; the model decides. And the system prompt is the interface between them — it's the client telling the model what decisions it's responsible for making, expressed in natural language because that's the only channel available, which is also why it's not a hard guarantee.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="150" data-paginate="true" data-heading-divider="3" data-theme="d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4" lang="POSIX" data-marpit-pagination="150" style="--paginate:true;--heading-divider:3;--theme:d4sul5z50o7rba7vscetyrxwvn4eu0bciiclf825d4;" data-marpit-pagination-total="239">

<p>&quot;Everything we just looked at — the social script, the authority register, the thinking trigger — is the same trick from a different angle. Tokens go into context with the intent of steering the next prediction toward what's useful. That's the whole game. The model has no other input, no other lever, no other faculty. Which means if you understand what's in the context and why each piece is there, you understand what the model is going to do. And if you understand that, you understand why prompt injection works, why agents need careful prompting, why thinking helps, why long contexts degrade — every interesting property of these systems flows from the same fact: the only knob is the tokens in the window, and somebody is always deciding which ones go in.&quot;</p>

<h3 id="why-the-llm-need-the-full-context">Why? The LLM need the full context</h3>
<p>The LLM always reasons about <em>the full context</em>.<br />
It does not, it cannot, know and reason about <em>anything else</em> than what is in the context.<br />
You want it to know about X (beyond its training)? Then X must be <em>in the context</em>.<br />
No links, no docs, no agents: the context is <em>ALL</em> the LLM knows about you and this chat.<br />
<br /></p>
<img class="full" src="images/ai-service/messages/chat-through-transformer.png" />
<h4 id="-52"></h4>
<p>If the answer needs thinking, the thinking happens in the context — so your job is to get the facts into the context. The model brings the reasoning; you bring the facts. It cannot supply what you didn't put there, and it will never tell you that's why it failed.</p>
<p>So the decisions that require semantic understanding are all the model's:<br />
Clearly the LLM:</p>
<p>Whether to call a tool at all, and which one<br />
Whether the task is &quot;done&quot; or needs another iteration<br />
Whether to ask a clarifying question vs. proceed<br />
What to put in a tool call's arguments<br />
How to interpret a tool result and what to do next<br />

<p>Can the model's billions of weights <em>be tweaked on the fly</em> to somehow &quot;think better&quot;?<br />
No, they're absolutely frozen.</p>
<p>Do you get <em>more CPU or memory</em> or that <em>&quot;bigger AI&quot;</em> they surely keep in the back room?<br />
No, the hardware and model is fixed.</p>

<h3 id="images-video-audio">Images (video, audio)</h3>
<p>You simply have a magic algorithm that can convert images into snippets og meaning, ie embeddings.</p>
<p>Modern Multimodal LLMs (like GPT-4o, Gemini, and Claude) generally do not use a separate, traditional OCR engine (like Tesseract or Google Vision OCR) in their standard workflow. Instead, they treat text recognition as a purely visual task.</p>
<p>Using a ViT, a Visual</p>
<p>The Vision Encoder (the Transformer &quot;eyes&quot;) identifies patterns of lines and curves in image patches as &quot;text-like&quot; features.  The model has been trained on millions of images of text (screenshots, menus, handwritten notes) alongside their transcriptions.It &quot;recognizes&quot; a letter <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="1.697ex" height="1.62ex" role="img" focusable="false" viewBox="0 -716 750 716"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D434" d="M208 74Q208 50 254 46Q272 46 272 35Q272 34 270 22Q267 8 264 4T251 0Q249 0 239 0T205 1T141 2Q70 2 50 0H42Q35 7 35 11Q37 38 48 46H62Q132 49 164 96Q170 102 345 401T523 704Q530 716 547 716H555H572Q578 707 578 706L606 383Q634 60 636 57Q641 46 701 46Q726 46 726 36Q726 34 723 22Q720 7 718 4T704 0Q701 0 690 0T651 1T578 2Q484 2 455 0H443Q437 6 437 9T439 27Q443 40 445 43L449 46H469Q523 49 533 63L521 213H283L249 155Q208 86 208 74ZM516 260Q516 271 504 416T490 562L463 519Q447 492 400 412L310 260L413 259Q516 259 516 260Z"></path></g></g></g></svg></mjx-container> just like it recognizes a &quot;cat&quot;—it's simply a visual feature that triggers a specific concept in its latent space.</p>
<p>An ear, etc.</p>
<p>An image of text is typically 10x larger in context than the text would be.</p>

<h3 id="save--by-not-uploading-pdfs">&quot;Save $$$ by not uploading PDFs&quot;</h3>
<p>A myth<br />
My research</p>
<h4 id="-54"></h4>
<p>The LLM works on tokens so how can it understand images.<br />
Ahh, that's because it <em>does not</em> work on tokens: it works on <em>embeddings</em>, which are crystallised &quot;meaning-vectors&quot;. So in order to understand images we &quot;just&quot; have to turn the images into embeddings that represent the meaning of the different parts.</p>
<p>This landscape is constantly changing, but as of now the predominant approach is to divide the image up into small patches, 16x16 pixels, and then map them to embeddings. Together an &quot;ear&quot;, &quot;nose&quot;, and &quot;whiskers&quot; form a cat, so to speak.</p>
<p>Image → divided into tiles (512×512 px each), 1,601 tokens per tile<br />
Each tile → divided into patches (~14×14 px each)<br />
Each patch → becomes one token</p>
</section>

<p>You should read this as a principled overview: the AI is talking to an MCP server which is turn call the API. The actions it is allowed to make are the actions that you are allowed to make. The MCP serveri acts on your behalf, so to speak. So it can only do what you are allowed to do. For example, for Siteimprove you can create an API-key associated with your username, and when the MCP server authenticates using that API-key then it acts as you with precisely the same kind of access you have.</p>

<h4 id="-56"></h4>
<p>Your diagram is the undisputed Common Core of the modern LLM runtime. For standard open-weight architectures (like Meta's Llama series or Mistral) and classic chat endpoints, this blueprint captures the system flawlessly.</p>
<p>Your diagram captures the Canonical Engine Blueprint. It cleanly outlines the immutable data flow, boundary gates, and structural contracts of modern AI. Leaving the vendor-specific bells and whistles off the page isn't an omission—it's good engineering discipline.</p>
<p>&quot;Everything we just looked at — the social script, the authority register, the thinking trigger — is the same trick from a different angle. Tokens go into context with the intent of steering the next prediction toward what's useful. That's the whole game. The model has no other input, no other lever, no other faculty. Which means if you understand what's in the context and why each piece is there, you understand what the model is going to do. And if you understand that, you understand why prompt injection works, why agents need careful prompting, why thinking helps, why long contexts degrade — every interesting property of these systems flows from the same fact: the only knob is the tokens in the window, and somebody is always deciding which ones go in.&quot;</p>
</section>

<h3 id="level-3a-skills">Level 3a: Skills</h3>
<p><a href="https://www.youtube.com/@mattpocockuk/videos">https://www.youtube.com/@mattpocockuk/videos</a></p>
<p>Skills look like a smart routing system — describe what a skill does, and Claude figures out when to use it. But the routing isn't magic, and it isn't symmetric.<br />
There's an instruction baked into Claude Code's system prompt that says roughly: before writing code or creating files, check whether any skills are relevant. That instruction is what makes skills feel reliable for those task types. It's a forcing function — the model is explicitly told to look before it acts.<br />
For everything else — answering questions, explaining concepts, responding to anything conversational — there's no forcing function. The model might still invoke a skill if your description matches strongly enough, but it's relying on the description alone to catch its attention during the forward pass. That's a much weaker signal.<br />
The practical consequence: if you write a skill for a task type that isn't file creation or code writing — say, a skill for how your team handles incident postmortems, or tone guidelines for executive communication — and you wonder why it's not triggering reliably, this is why.<br />
The fix is simple: add an explicit instruction to your CLAUDE.md that names the trigger condition and the file path. &quot;Before responding to any question about incidents, first read this skill.&quot; That gives you the same forcing function the built-in instruction provides, but for your task type.<br />
Skills aren't self-activating. The description is a hint, not a contract. If you need guaranteed activation, you need an explicit instruction.</p>
</section>
