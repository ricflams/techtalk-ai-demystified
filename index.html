</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="213" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="213" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312">
<h3 id="why-the-ai-need-the-full-context">Why? The AI need the full context</h3>
<p>The LLM always reasons about <em>the full context</em>.<br />
It does not, it cannot, know and reason about <em>anything else</em> than what is in the context.<br />
You want it to know about X (beyond its training)? Then X must be <em>in the context</em>.<br />
No links, no docs, no agents: the context is <em>ALL</em> the LLM knows about you and this chat.<br />
<br /></p>
<img src="images/ai-service/messages/chat-through-transformer.png" />
<h4 id="-87"></h4>
<p>If the answer needs thinking, the thinking happens in the context — so your job is to get the facts into the context. The model brings the reasoning; you bring the facts. It cannot supply what you didn't put there, and it will never tell you that's why it failed.</p>
<p>So the decisions that require semantic understanding are all the model's:<br />
Clearly the LLM:</p>
<p>Whether to call a tool at all, and which one<br />
Whether the task is &quot;done&quot; or needs another iteration<br />
Whether to ask a clarifying question vs. proceed<br />
What to put in a tool call's arguments<br />
How to interpret a tool result and what to do next<br />
Whether to flag a potential prompt injection in a tool result</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="214" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="214" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312">

<p>If you're building an agent, ie interacting with the AI service directly, then you're responsible for adding all this kind of useful info.</p>

		&quot;Respond in Italian. Use Italian for all responses regardless of the language the user writes in.&quot;
	claude.md / gemini.md / agents.md etc
		Eg tell what claude /init does: produce a compact overview of things that are useful to say about this folder
	personalization, memories, ...
	[current file, selected text, terminal output, etc]
	Also, the difference between plan and agent mode
	How big is it? Show some examples.
	There’s no privileged channel; system prompt and user messages are all just tokens by the time the model sees them
</code></pre>

<p>Can the model's billions of weights <em>be tweaked on the fly</em> to somehow &quot;think better&quot;?<br />

<h3 id="lets-zoom-in">Let's zoom in</h3>
<p>TODO: zoomed in</p>
<ul>
<li>Thinking is an autoregressive loop wrapped around the LLM: generate a &quot;thought&quot;-mode output, append it to the context, run the forward pass again, repeat.</li>
<li>The name is <strong>Chain of Thought</strong>, aka <strong>CoT</strong>.</li>
</ul>
<p><a href="https://claude.ai/chat/8b6e9845-edb1-43b0-aeb5-f90d7e9650db">https://claude.ai/chat/8b6e9845-edb1-43b0-aeb5-f90d7e9650db</a><br />
chain-of-thought is the escape hatch for the layer ceiling. It converts hardware-limited internal reasoning into serialized external reasoning, and that's why it works. It also predicts exactly what we observe: on problems that fit in the silent chain, models answer instantly and correctly; on problems that don't, they either get it wrong (no reflection) or need extended thinking to get it right (reflection converts depth into length).<br />
Your intuition that some problems would need &quot;layer 150&quot; is not just plausible — it's what the entire scratchpad/reasoning-mode ecosystem exists to work around.</p>
<h4 id="-90"></h4>
</section>

<h3 id="save--by-not-uploading-pdfs">&quot;Save $$$ by not uploading PDFs&quot;</h3>
<p>A myth<br />
My research</p>
<h4 id="-91"></h4>
<p>The LLM works on tokens so how can it understand images.<br />
Ahh, that's because it <em>does not</em> work on tokens: it works on <em>embeddings</em>, which are crystallised &quot;meaning-vectors&quot;. So in order to understand images we &quot;just&quot; have to turn the images into embeddings that represent the meaning of the different parts.</p>
<p>This landscape is constantly changing, but as of now the predominant approach is to divide the image up into small patches, 16x16 pixels, and then map them to embeddings. Together an &quot;ear&quot;, &quot;nose&quot;, and &quot;whiskers&quot; form a cat, so to speak.</p>
<p>Image → divided into tiles (512×512 px each), 1,601 tokens per tile<br />
Each tile → divided into patches (~14×14 px each)<br />
Each patch → becomes one token</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="246" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="246" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312">
<h2 id="use-tools">Use Tools</h2>
<p>the canonical published answer is Toolformer (Schick et al. 2023), and it's worth knowing because it's mechanistically clean rather than hand-wavy. They had a base LM propose where API calls might go in ordinary text, actually executed those calls, and then kept an insertion only if having the call+result reduced the model's loss on the subsequent tokens — i.e., only if the call demonstrably helped predict what came next. Then they fine-tuned on the augmented text with the useful calls inlined. The filter is self-supervised: usefulness is defined as &quot;did this make the future more predictable,&quot; not human judgment.<br />
<a href="https://www.youtube.com/watch?v=LxZ3gYvbV7I">Toolformer: AI learns to use APIs - AssemblyAI</a>  (5 min)<br />
<a href="https://www.youtube.com/watch?v=UID_oXuN-0Y">Timo Schick | Toolformer: Language Models Can Teach Themselves to Use Tools</a> (55 min)</p>
<p><a href="https://arxiv.org/abs/2302.04761">Toolformer: Language Models Can Teach Themselves to Use Tools</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="247" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="247" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312">
<h3 id="the-llm-can-ask-to-use-a-tool">The LLM can ask to use a tool</h3>

<h3 id="skills">Skills</h3>
<p><a href="https://www.youtube.com/@mattpocockuk/videos">https://www.youtube.com/@mattpocockuk/videos</a></p>
<p><a href="https://www.youtube.com/watch?v=UNzCG3lw6O0">https://www.youtube.com/watch?v=UNzCG3lw6O0</a></p>
<p>Skills look like a smart routing system — describe what a skill does, and Claude figures out when to use it. But the routing isn't magic, and it isn't symmetric.<br />
There's an instruction baked into Claude Code's system prompt that says roughly: before writing code or creating files, check whether any skills are relevant. That instruction is what makes skills feel reliable for those task types. It's a forcing function — the model is explicitly told to look before it acts.<br />
For everything else — answering questions, explaining concepts, responding to anything conversational — there's no forcing function. The model might still invoke a skill if your description matches strongly enough, but it's relying on the description alone to catch its attention during the forward pass. That's a much weaker signal.<br />
The practical consequence: if you write a skill for a task type that isn't file creation or code writing — say, a skill for how your team handles incident postmortems, or tone guidelines for executive communication — and you wonder why it's not triggering reliably, this is why.<br />
The fix is simple: add an explicit instruction to your CLAUDE.md that names the trigger condition and the file path. &quot;Before responding to any question about incidents, first read this skill.&quot; That gives you the same forcing function the built-in instruction provides, but for your task type.<br />
Skills aren't self-activating. The description is a hint, not a contract. If you need guaranteed activation, you need an explicit instruction.</p>

<h3 id="saying-please">Saying Please</h3>
<p>&quot;The real reason to be polite: it's good for you (oxytocin vs cortisol), even in simulated conversation.&quot;<br />
<a href="https://claude.ai/chat/6e957ec3-8060-476d-867f-c59c42437d79">https://claude.ai/chat/6e957ec3-8060-476d-867f-c59c42437d79</a><br />
One researcher offers a grounded explanation for why politeness might have any effect at all: &quot;please&quot; and &quot;thank you&quot; add conversational structure, making it clearer that what follows is a request — and more structure tends to make for better prompts. Additionally, politeness prompts tone-mirroring, which may or may not affect quality.<br />
Multi-turn cost is unaccounted for. All the studies measured single-turn accuracy or quality. Your hypothetical is exactly right — if a terse impolite response omits something the user needed, the follow-up exchange adds tokens that could exceed what a fuller polite response would have cost. Nobody has measured conversation-level cost to resolution.</p>
</section>

<p>&quot;Lost in the middle was real in 2023, is largely solved for simple retrieval in 2026, persists for complex tasks — and the reason it ever existed is still being worked out. so my suggestion is: stop worrying about the middle, and start worrying about the load. &quot;Keep your facts close and your context lean.&quot;</p>

<h3 id="hallucinations">Hallucinations</h3>
<p>for most models, including the latest GPT and Gemini iterations, deeper reasoning actually lowers the success rate at detecting nonsense — the &quot;Reasoning Paradox.&quot; So the slide-safe version: CoT re-rolls the dice; it doesn't load them with truth.<br />
<a href="https://claude.ai/chat/a3c1720b-17f5-46b4-8f93-93b22926f713">https://claude.ai/chat/a3c1720b-17f5-46b4-8f93-93b22926f713</a></p>
<p>The model doesn't know it's wrong when it hallucinates<br />
Developers expect that incorrect output means uncertain output — that the model would hedge or flag uncertainty. The model's confidence is calibrated to its training distribution, not to correctness. It can be completely wrong and completely confident simultaneously because plausibility and truth are different things.</p>
</section>

<h2 id="advice">Advice</h2>
<p>Give examples.</p>
<p>I use LLMs frequently to help build Excel tools and calculators, especially for budget management, both professionally and personally. I’ll often explain what I want it to do, all the parameters, etc. but then will end the prompt with, “Before you start building, let me know what questions or uncertainties you have, or what clarifications you need”.<br />
I often find that with whatever it responds with that I wasn’t clear enough with my initial explanation and request. A quick clarification on the front end helps save a lot of time from having it rebuild tools over and over due to my poor directions.</p>
<p>Be precise. Don't say &quot;it's green&quot; or &quot;it should not be green&quot;, but &quot;it should be red&quot;</p>
<p>Consider your prompts first-level source too, eligible to be committed.<br />
Deterministic vs pure AI-driven.</p>
</section>

interpretability</p>
<p>2019, The mainstream view was that you needed cleverer architectures, not bigger ones.</p>
<p>Rich Sutton's 2019 essay &quot;The Bitter Lesson&quot; argued that throughout AI history, generic methods that leverage compute (search, learning) have repeatedly beaten clever methods that encode human knowledge. Game playing, vision, speech — same pattern every time. Sutton's conclusion was uncomfortable: stop building in your priors, just scale.</p>
<p>GPT-2 (1.5B params, 2019) had produced surprisingly fluent text. But &quot;fluent text&quot; isn't &quot;general capabilities.&quot; The leap to GPT-3 was ~100×</p>
<p>The wager was not &quot;the loss curve will keep going&quot; — Kaplan had already shown that. The wager was: something qualitatively useful will fall out of low enough loss. That part had no theoretical basis. GPT-2 had shown hints — coherent paragraphs, some pattern-following within a prompt — but few-shot learning as a general capability wasn't predicted by any theory.</p>
<p>The paper's title — &quot;Language Models are Few-Shot Learners&quot;</p>
</section>
