<h1 id="ai-demystified">AI Demystified</h1>
<p>Richard Flamsholt</p>
<p>August 2026</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="2" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312" data-marpit-advanced-background="background"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;images/intro/dopamine.png&quot;);"></figure></div></section></foreignObject><foreignObject width="1280" height="720"><section id="2" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="2" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312" data-marpit-advanced-background="content">
<h4 id=""></h4>
<p>Over time, some landmark tech has particularly triggered my brain.</p>
<p>Back when HTML and XML came out I was like, man, I just want to know all about it.</p>
<p>Same with Java and .NET, with their intriguing bytecode and VM-engines.</p>
<p>For the past year I've felt that way about AI. And I think we're all filled with emotions about AI. It's so exciting and promising, but also mysterious. There's this feeling that &quot;it can do anything if I only hold it right&quot;. that can lead to FOMO, fear of holding it wrong, disappointment in the AI or yourself if it doesn't work as well as imagined.</p>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="2" style="" data-marpit-pagination-total="312" data-marpit-advanced-background="pseudo"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="3" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312" data-marpit-advanced-background="background"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;images/intro/lightbulb.jpeg&quot;);"></figure></div></section></foreignObject><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="3" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312" data-marpit-advanced-background="content">
<h4 id="-1"></h4>
<p>Many lightbulb-moments have given me a better fundamental understanding of AI and how to best use it. The context, cost, limitations. It has <em>demystified</em> the AI and I wish for other to have that insight too.</p>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="3" style="" data-marpit-pagination-total="312" data-marpit-advanced-background="pseudo"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="4" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312" data-marpit-advanced-background="background"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;images/intro/bread/loaf.jpg&quot;);"></figure></div></section></foreignObject><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="4" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312" data-marpit-advanced-background="content">
<h4 id="-2"></h4>
<p>Let's begin far removed from any AI: a nice freshly baked bread.</p>
<p>You can bake lovely, soft, crunchy bread without knowing what &quot;yeast&quot; actually is or what it does. &quot;Add yeast, then set the clock to let the dough rise for one hour&quot;, as the recipe says. The bread comes out fine. Usually.</p>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="4" style="" data-marpit-pagination-total="312" data-marpit-advanced-background="pseudo"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="5" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312" data-marpit-advanced-background="background"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;images/intro/bread/rise.jpg&quot;);"></figure></div></section></foreignObject><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="5" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312" data-marpit-advanced-background="content">
<h4 id="-3"></h4>
<p>But how <em>does</em> yeast cause the dough to &quot;rise&quot;? And should it be placed somewhere warm? But not too warm?</p>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="5" style="" data-marpit-pagination-total="312" data-marpit-advanced-background="pseudo"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="6" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312" data-marpit-advanced-background="background"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;images/intro/bread/cold.png&quot;);"></figure></div></section></foreignObject><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="6" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312" data-marpit-advanced-background="content">
<h4 id="-4"></h4>
<p>Some even say &quot;put the dough in the fridge&quot;. It can seem a bit mysterious.</p>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="6" style="" data-marpit-pagination-total="312" data-marpit-advanced-background="pseudo"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="7" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312" data-marpit-advanced-background="background"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;images/intro/bread/science.png&quot;);background-size:contain;"></figure></div></section></foreignObject><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="7" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312" data-marpit-advanced-background="content">
<h4 id="-5"></h4>
<p>Now, if you know that yeast is a living organism that cause fermentation by using enzymes to feed on sugar in the flour, then the whole thing can become quite demystifed. Still complex, sure, but you can now understand how the choice of flour, additives, and temperature over time affect the dough. And understand how you can make deliberate choices to &quot;steer&quot; the dough better.</p>
<p>For example a &quot;cold ferment&quot;: let the yeast work normally for an hour and then place the dough in the fridge to put the yeast to sleep while the enzymes continue to work on building flavor and gluten. A lot of advanced baking processes can seem arbitrary or magical (&quot;add diastatic malt powder to ...&quot;) but armed with a fundamental understanding of the way yeast and enzymes works you're much better equipped to understand them - and steer them your own way, too.</p>
</section>

<h4 id="-6"></h4>
<p>This presentation is about the yeast and enzymes of AI. And frankly, it's about <em>all of the AI</em>.</p>

<h4 id="-7"></h4>
<p>Let me say this up front: will that knowledge turn you into an expert baker overnight? Maybe not. But it will help you reason about the underlying mecahnisms, the fundamental behavior and limitations of the AI. Personally I have found that really, really useful.</p>

<p>Because it's not some fringe topic, like for example Quantum Computing, where I can shine or dazzle you and you frankly wouldn't have much use of it anyway. On the contrary: everybody is interested in AI and everybody's using AI and I should most certainly strive to give insights that is truly useful. That, I decided, would be the fundamentals: the LLM and AI-service itself, the core understanding that is still relevant in a year. Just those parts. Just keep it simple, I thought.</p>

<h4 id="-14"></h4>
<p>Final words: I've strived to make the presentation deep and useful but also entertaining and surprising. Be prepared to stay alert, because there's a lot to cover in only one hour so we'll move really fast.</p>

</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="17" style="" data-marpit-pagination-total="312" data-marpit-advanced-background="pseudo"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="18" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312">
<img src="images/overview/full.png" />
<p>You, the <strong>human</strong>, use an <strong>AI Agent</strong> to communicate with an <strong>AI Service</strong> that turn your messages into <strong>tokens</strong> and feed it through an <strong>LLM</strong>. The service and agent can use <strong>tools</strong> and the client can <strong>remember</strong>.</p>
<h4 id="-15"></h4>
<p>This is what we'll cover.</p>
<p>I've already said &quot;the AI&quot; many times. Let's be clear: in this presentation I am talking about AI that generates text, like Claude, ChatGPT, Gemini, Grok, etc. They all use an LLM, a Large Language Model AI, and their principles and capabilities are very similar, broadly speaking.</p>
<p>So AI here means generative text AI. Not AI for generating images using stable diffusion, not AI for self-driving cars, not AI for folding proteins.</p>
<p><a href="https://www.youtube.com/watch?v=aBUniZHgCnE">Understand AI in 14 minutes – with Anthropic's Chloe Lubinski [ARC 2026]</a></p>

<h4 id="-19"></h4>
<p>Notice that &quot;hello&quot; in the gpt-4o tokenizer is #24912 and in the ChatGPT vocabulary it's 15339. Vocabularies change from model to model. The concrete numbers doesn't matter outside of the AI service so you shouldn't rely on them.</p>

<p>This shows one advantage of the tokenization: simply fewer tokens than if everything was spelled out.</p>

<h4 id="-21"></h4>
<p>The first four words are common and have each their own token, but much to my disappointment it seems &quot;Flamsholt&quot; isn't worthy of getting its own token so it's made up of 3 parts.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="36" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="37" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312">

<img src="images/token/wonderful-tokenization.png" />
<h4 id="-23"></h4>
<p>Another advantage of tokenization is that it allow identifying common linguistic &quot;traits&quot;, such as &quot;ization&quot; which is about &quot;doing/producing something&quot;. Works for other languages too.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="38" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312">

</section>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-marpit-fragments="5" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="43" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312">
<h3 id="tokens-summarized">Tokens, summarized</h3>
<div class="cols">
<img class="col-1" src="images/token/ride-tokens.png" />
<div class="col-3" >
<ul>
<li data-marpit-fragment="1">A <strong>token</strong> is the <em>chunk of text</em> the LLM reason about</li>
<li data-marpit-fragment="2">Models typically have a <strong>vocabulary</strong> of 200,000 tokens</li>
<li data-marpit-fragment="3">For English, 1 token is roughly 1 word (3/4 of a word)</li>
<li data-marpit-fragment="4">Tokens are language agnostics - it's all &quot;just tokens&quot;<br />
<br /><br />
Last, but not least:<br />
<br /></li>
<li data-marpit-fragment="5">Ultimately, cost is measured <em>in tokens</em></li>
</ul>
</div>
</div>
<h4 id="-28"></h4>
<p>For English, one token generally corresponds to about 4 characters. For a text the number of tokens will typically be 30% higher than the number of words, ie 1000 words means 1300 tokens - broadly speaking.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="44" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312">
<h2 id="embeddings">Embeddings</h2>
<img src="images/overview/embeddings.png" />
<h4 id="-29"></h4>
<p>In everyday English &quot;embedding&quot; sounds like something you do: the act of placing something into something else.</p>
<p>In AI, it means a concrete vector of numbers that <em>somehow</em> represent the characteristics of something. It's a noun, not a verb. It's a &quot;thing&quot;, not something that &quot;happens&quot;.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="45" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312">
<h3 id="an-embedding-embodies-the-meaning-characteristica-features-traits--of-something-anything">An embedding embodies the meaning (characteristica, features, traits, ...) of something, anything</h3>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="46" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312">
<h3 id="stay-with-me">Stay with me</h3>
<img src="images/embedding/confused.png" />
<h4 id="-30"></h4>
<p>You probably knew about tokens. Embeddings are the &quot;live&quot; counterpart to tokens, and they are incredibly valuable to grasp the meaning of. It may feel abstract and complex so sit tight.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="47" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312">
<h3 id="specialty-coffee-association-sca">Specialty Coffee Association (SCA)</h3>
<img src="images/embedding/analogy_coffee.svg" />
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="48" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312">
<h3 id="spotifys-80-dimensional-characteristics">Spotify's 80-dimensional characteristics</h3>
<img src="images/embedding/analogy_spotify.svg" />
<h4 id="-31"></h4>
<p>Spotify really does characterize music using 80 dimensions.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="49" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312">
<h3 id="imagine-capturing-the-essense-of--anything">Imagine capturing the essense of ... anything</h3>
<img src="images/embedding/20d-with-tokens.svg" />
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="50" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312">
<h3 id="an-embedding-is-a-tokens-characteristics">An embedding is a token's characteristics</h3>
<div class="cols">
<div>
	<img src="images/embedding/20d-kitten.png" />
</div>
<div class="col-6">
<p>An <strong>embedding</strong> is a list of numbers (also called a <strong>vector</strong> or <strong>tensor</strong>) that <em>somehow</em> characterises <em>something</em>. Sometimes called &quot;features&quot;, as each value in the vector encodes some semantic trait of the token.</p>
<p>The number of nuances, characteristics, we decide to use is called the embedding's <strong>dimension</strong>. If we choose 20 characteristics then the embedding of &quot;kitten&quot; has 20 dimensions.</p>
<p>Each number is called the <strong>weight</strong> of that dimension.</p>
<p>Embeddings can be: Any <em>word</em> you know. Any <em>sentence</em> there exist. Any <em>feeling</em> you can have. Any <em>concept</em>, including e.g. <em>a curious yet mildly confused audience</em>.</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-marpit-fragments="14" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="51" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312">
<h3 id="more-of-anything-imaginable">More of &quot;anything imaginable&quot;</h3>
<div class="cols">
<div>
<ul>
<li data-marpit-fragment="1">The concept of the number 7</li>
<li data-marpit-fragment="2">Loneliness in a crowded place</li>
<li data-marpit-fragment="3">The entire first <em>Harry Potter</em> book</li>
<li data-marpit-fragment="4">A single chess position mid-game</li>
<li data-marpit-fragment="5">The smell of rain on hot asphalt</li>
<li data-marpit-fragment="6">A user's purchases on a website</li>
<li data-marpit-fragment="7">A protein's amino acid sequence</li>
</ul>
</div>
<div>
<ul>
<li data-marpit-fragment="8">The grammatical role &quot;indirect object&quot;</li>
<li data-marpit-fragment="9">The concept of sarcasm <em>(yeah, right)</em></li>
<li data-marpit-fragment="10">What &quot;London-ness&quot; feels like</li>
<li data-marpit-fragment="11">A function's behavior in a codebase</li>
<li data-marpit-fragment="12">A legal precedent in criminal law</li>
<li data-marpit-fragment="13">The notion of &quot;almost, but not quite&quot;</li>
<li data-marpit-fragment="14">What 3 a.m. feels like</li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="52" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312">
<h3 id="every-token-has-an-embedding-vector">Every token has an embedding-vector</h3>
<img src="images/embedding/vocabulary-gpt-3.png" />
<p>ChatGPT 3 has <em>50257 tokens</em>, each described by a <em>12288-dimensional</em> embedding</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="53" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312">
<h3 id="the-examples-embeddings">The example's embeddings</h3>
<img src="images/embedding/embedding-matrix.png" />
<h4 id="-32"></h4>
<p>Each of these lists of 12288 numbers represent the core meaning of that single token. The meaning of &quot;Please&quot;, the meaning of &quot;tell&quot;, the meaning of &quot;me&quot;, and so on.</p>
<p>So what we have here is a set of numbers that essentially represents the full meaning of the entire context.</p>
<p>The weights are constructed during the LLM's training. Right now just accept that those 12288 numbers do in fact characterise all aspects of one single token. We'll cover how they've come to be later.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="54" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312">
<h3 id="an-embedding-is-a-direction-in-a-hyper-dimensional-space-of-everything-that-exists">An embedding is a &quot;direction&quot; in a hyper-dimensional space of everything that exists</h3>
<img src="images/embedding/space/word-embeddings.png" />
<h4 id="-33"></h4>
<p>One way to think about an embedding is as a &quot;direction&quot;, an &quot;arrow&quot;, in a hyper-dimensional space of every conceivable and inconceivable concept. Because that is, in fact, what it is. And it leads to some astounding and surprising behaviors.</p>
<h4 id="-34"></h4>
<p>Also known as the <strong>latent space</strong>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="55" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312">

<h3 id="takeaway-about-embeddings">Takeaway about embeddings</h3>
<ol>
<li><em>Compare</em> embeddings to figure out how similar the meanings they represent are<br />
For instance, find a <em>synonym</em> by simply finding the closest embeddings to a word<br />
<br /></li>
<li>Embeddings are &quot;meanings&quot; and that meaning can be <em>transformed with math</em><br />
<br /></li>
<li>An embedding is <em>just some numbers</em>. Cheap to store in a database and work on.<br />
<br /></li>
<li>(Covered later) The embeddings relates to <em>a concrete model</em> and are created during the training of that specific model; their numbers only make sense to that model</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="70" data-marpit-fragments="3" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="70" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312">
<h3 id="an-embedding-any-meaning-as-numbers">An embedding: any meaning, as numbers</h3>
<img src="images/embedding/three-embeddings.svg" />
<h4 id="-36"></h4>
<p>To hammer it home: An embedding can be anything imaginable, not just a word. There's surely a 12228-dimensional set of numbers that represent <em>&quot;the hopeful feeling that the audience grasp a complex issue you explain&quot;</em>.</p>
<p>Frankly we simply don't know what the dimensions or numbers mean. They don't map crisply to existing human concepts but only makes mathematical sense. Dimension number 7 of &quot;Please&quot; might contribute a little to politeness, a little to interactivity, a little to something related to food, and a little to some abstract concept that doesn't map to any word in English.</p>
<p>There's a research field called mechanistic interpretability that tries to decompose these representations into interpretable directions. They can extract interpretable features, but understanding how features compose to produce behavior is still largely unsolved.</p>
<ul>
<li data-marpit-fragment="1"><a href="https://learnmechinterp.com/topics/scaling-monosemanticity/">Scaling Monosemanticity and Feature Steering</a></li>
<li data-marpit-fragment="2"><a href="https://www.anthropic.com/research/emotion-concepts-function">Emotion concepts and their function in a large language model</a></li>
<li data-marpit-fragment="3"><a href="https://www.youtube.com/watch?v=9-Jl0dxWQs8">How might LLMs store facts | Deep Learning Chapter 7 (3Blue1Brown)</a></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="71" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="71" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312">
<h3 id="the-llm-is-all-about-math-on-embeddings">The LLM is all about math on embeddings</h3>
<img src="images/llm/overview-embeddings.png" />
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="72" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="72" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312">
<h2 id="the-llm-1">The LLM</h2>
<img src="images/overview/llm.png" />
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="73" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="73" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312">
<h3 id="the-llm-large-language-model">The LLM, Large Language Model</h3>
<p>The LLM is all about <strong>math</strong> and <strong>statistics</strong>.<br />
<br /><br />
It does <strong>inference</strong> by running the embeddings in the <strong>context</strong> through a giant <strong>neural network</strong>. After billions of calculations the result is: <em>&quot;what token likely comes next?&quot;</em><br />
<br /><br />
It relies on what we just covered: on a <em>very large scale</em>, we can <em>do math on language</em>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="74" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="74" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312">
<h3 id="putting-the-example-through-the-llm">Putting the example through the LLM</h3>
<p>The <strong>context</strong> is the input given to the LLM - here, 10 tokens<br />
The <strong>context window</strong> is the longest input possible, typically 200,000-1,000,000 tokens<br />
<br /></p>
<img src="images/llm/what-is-an-llm-example.png" />
<h4 id="-37"></h4>
<p>Two things to note here:</p>
<p>Why only <code>An</code>? Why not the full answer? Yeah, hold your horses just a bit longer, because: the LLM only deals with producing one next token. That's all it is concerned about: figuring out with which <em>probablility</em> any of the tokens is the vocabulary has for being the next token.</p>
<p>That's the second thing to note: the LLM itself actually just produce this set of probabilities. The mechanism that actually <em>picks that next token</em> is strictly speaking outside the LLM. Let's include it here to convey that the outcome eventually is a token, namely <code>An</code> in this case.</p>
<h4 id="-38"></h4>
<p><a href="https://www.youtube.com/watch?v=LPZh9BOjkQs">Large Language Models explained briefly - 3Blue1Brown</a></p>
</section>

<h3 id="the-llms-objective-whats-the-next-token">The LLM's objective: what's the next token?</h3>
<img src="images/llm/find-the-next-token.png" />
<h4 id="-40"></h4>
<p>The very observant reader may spot something unexpected. I claimed that each token's embedding was a fixed vector. But why do the two instances of &quot;you&quot; then not have the same embedding-values?</p>
<p>That's because the transformer initially instill some positional information (1, 2, 3, ...) into each individual embedding, typically using <em>RoPE</em> (Rotary Position Embeddings) which &quot;rotates&quot; the vector in 2D spaces in each layer.</p>
<p>Surprisingly, changing the vector values does not remove any of the embedding's &quot;meaning&quot; in the high-dimensional space. It retains its core conceptual meaning, only nudged a little bit.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="79" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="79" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="81" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="81" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312">
<h3 id="attention-is-all-you-need">&quot;Attention is all you need&quot;</h3>
<div class="cols">
<img src="images/llm/attention-is-all-you-need.png" />
<img src="images/llm/attention-transformer.png" />
</div>
<h4 id="-41"></h4>
<p>The 2017 paper &quot;Attention Is All You Need&quot; by Vaswani et al. is arguably the most consequential piece of computer science research published in the 21st century.</p>
<p>Today, the paper sits at over 200,000 citations, making it an absolute statistical anomaly in scientific literature.</p>
<p>It is the Genesis block of modern AI. Without it, there is no GPT-4, no Gemini, no Claude, no Stable Diffusion, and no AlphaFold. It transformed AI from an academic field of hyper-specialized, rigid pipelines into a unified era of generalized foundation models.</p>
<p><a href="https://proceedings.neurips.cc/paper_files/paper/2017/file/3f5ee243547dee91fbd053c1c4a845aa-Paper.pdf">Attention Is All You Need</a></p>
</section>

<h3 id="first-all-embeddings-pay-attention">First, all embeddings &quot;pay attention&quot;</h3>
<img src="images/llm/attention-head.png" />
<h4 id="-42"></h4>
<p>Every embedding gets influenced by every embedding token before it. They &quot;absorb&quot; the meaning of all those other embedding, influenced also by the position. The first &quot;you&quot; and the second &quot;you&quot; come from the same token, yes, but by virtue of their position they don't carry the same meaning, i.e. they don't start out as the same embedding-values, and they rub against (&quot;pays attention to&quot;) the other tokens in different ways.</p>
<p>For a full 1M context-window this means that up all 1 million embeddings pays attention to every other of the 1 million embeddings before it. That's the order of a million times a million calculations.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="85" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="85" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312">

<h3 id="find-next-token-by-similarity-comparison">Find next token by similarity-comparison</h3>
<p>Also known as &quot;cosine similarity&quot;</p>
<p>Score all tokens in the vocabulary (1-200,000 tokens)</p>
<img src="images/llm/next-token-prediction.svg" />
<h4 id="-49"></h4>
<p>The cosine similarity of 0.97 is computed in isolation — it's purely a geometric measurement between two vectors, with no knowledge of the other 127,999 tokens. The 91% is a different kind of number entirely: it's the result of a competition. Softmax takes all 128,000 similarity scores simultaneously, exponentiates each one, and divides by their sum. Every token competes against every other token at once. &quot;Stronger&quot; claimed 91% of the total probability mass — not because 0.97 is intrinsically high, but because it pulled far enough ahead of the field. A high cosine similarity is the evidence. The probability is the verdict.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="93" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="93" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312">

<h3 id="tokens-are-really-generated-one-by-one">Tokens are really generated one by one</h3>
<p>That's why output tokens are typically <em>5 x more expensive</em> than input tokens.<br />
<br /></p>
<img src="images/llm/tokenized-output.png" />
<h4 id="-51"></h4>
<p>This is what really boggles my mind. Each token is generated completely independently, only by choosing the most likely next word to come after what has already been seen now. There is no planning.</p>
<p>There's no plan to &quot;bold&quot; a word by emitting <code>** something **</code>. Instead at one point an <code> **</code> is emitted and later on another <code>**</code> is emitted.</p>
<p>There's no planning of emitting an itemized list. At one point a <code>1</code> is emitted and then a <code>.</code> and that cause the likelyhood pattern-wise of a later <code>2</code> and <code>.</code> to occur to rise significantly. But it happens independently without any overall grand design or planning.</p>
<p>Not so: j-space.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="99" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="99" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312">

<h4 id="-52"></h4>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="121" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="121" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312">
<h3 id="are-all-ai-models-the-same">Are all AI models the same?</h3>
<img src="images/training/chatgpt-lingo.png" />
<h4 id="-55"></h4>
<p>Admittedly I coached ChatGPT into dialing up its &quot;chatgppt-ness&quot; to the max before asking this question. And honestly? It worked.</p>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="122" data-marpit-fragments="3" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="122" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312">
<h3 id="how-models-are-trained">How models are trained</h3>
<img src="images/training/training.png" />
<h4 id="-56"></h4>
<ul>
<li data-marpit-fragment="1">Base training - the &quot;auto-complete&quot; <em>facts</em></li>
<li data-marpit-fragment="2">Alignment learning - the <em>values</em></li>
<li data-marpit-fragment="3">Fine-tuning / RAG - the <em>specialization</em></li>
</ul>
<p>Pretraining is where the model learns language itself. Fed vast amounts of text, it learns to predict the next token — nothing more. The result is a powerful but raw capability: it knows how language works, how facts relate, how arguments are structured. It has no personality, no values, no sense of what a &quot;good&quot; response looks like.</p>
<p>Supervised Fine-Tuning (SFT) and Reinforcement Learning is where the model learns what good means to its creators. Humans or AI (RLHF or RLAIF) evaluators compare outputs and rank them. The model is iteratively shaped toward preferred behavior — this is where values, tone, refusal behaviors, and personality get baked in.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="123" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="123" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312">

<img src="images/training/training-corpus.png" />
<h4 id="-57"></h4>
<p>Putting the <strong>Large</strong> in the <em>&quot;Large Language Model (LLM)&quot;</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="124" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="124" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312">
<h3 id="model-and-embeddings-are-born-via-training">Model and embeddings are born via training</h3>
<div class="cols">
<div class="col-2">
	<img src="images/training/training-example.png" />
</div>
<div>
<p><strong>Backpropagation</strong>:</p>
<ol>
<li>Run tokens through the network like at generate</li>
<li>Paths to the expected token are rewarded, others are punished</li>
<li>Adjust the full network, back to the embeddings</li>
<li>Causal masking trains all sub-strings, too</li>
<li>Train on a gazillion texts</li>
</ol>
</div>
</div>
<h4 id="-58"></h4>
<p>Finally, rather unceremoniously: this is how both the model's weights and the embeddings get their values. By training immensely to find the right balance where all training texts produce the expected next token.</p>
<p>It's amazing and surprising that it works.</p>

<img src="images/training/reinforcement-learning.png" />

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="132" data-marpit-fragments="3" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="132" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312">
<h3 id="reinforcement-learning-by-feedback">Reinforcement Learning by Feedback</h3>
<p><strong>RLHF</strong> - Reinforcement Learning from <em>Human Feedback</em> (declining)<br />
<strong>RLAIF</strong> - Reinforcement Learning from <em>AI Feedback</em> (growing)<br />
<br /></p>
<img src="images/training/reinforcement-training-trend.png" />
<h4 id="-60"></h4>
<p>Frontier labs almost universally outsource the bulk of RLHF annotation rather than hiring raters directly. The main intermediaries:</p>
<ul>
<li data-marpit-fragment="1">Scale AI / Outlier — the dominant player, operating as an end-to-end data engine. Outlier handles LLM annotation, Remotasks handles visual/multimodal work. Scale is OpenAI's preferred fine-tuning partner and has also worked with Meta, Google DeepMind, and others. Taskmonk AI</li>
<li data-marpit-fragment="2">Surge AI — Anthropic's primary RLHF provider, with ~50,000 expert contractors. Also used by OpenAI and Meta. Taskmonk AI</li>
<li data-marpit-fragment="3">Invisible — shifted from executive VA services to RLHF work for labs including Microsoft, Cohere, and Mistral. Routes model outputs through trained raters who score completions and rank outputs. Sacra</li>
</ul>
<p>Outlier alone runs a network of 700,000+ contractors globally. The work is heavily gig-economy in structure.</p>
<p>Pay ranges from $15/hr for generalist annotators up to $500+/hr for domain experts like medical fellows and legal professionals. Invisible charges labs $30–45/hr for annotation work while paying raters $15–20/hr.</p>
<p>Each major frontier AI lab spends approximately $1 billion per year on human-generated training data, according to a 2025 Time Magazine investigation.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="133" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="133" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312">

<img src="images/training/claudes-constitution.png" />
<h4 id="-61"></h4>
<p><a href="https://www.anthropic.com/constitution">Claude’s Constitution - Anthropic</a><br />
<a href="https://model-spec.openai.com/2025-12-18.html">OpenAI Model Spec</a></p>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="134" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="134" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312">
<h3 id="expresses-claudes-core-principles">Expresses Claude’s &quot;core principles&quot;</h3>
<img src="images/training/claudes-constitution-helpfulness.png" />
<h4 id="-62"></h4>
<p>The model spec is the closest thing to a public constitution. It defines a priority ordering:</p>
<p>Broadly safe (supporting human oversight)<br />
Broadly ethical (good values, honesty)<br />
Adherent to Anthropic's principles<br />
Genuinely helpful</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="135" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="135" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312">
<h3 id="dont-foster-excessive-engagement">&quot;Don't foster excessive engagement&quot;</h3>
<img src="images/training/claudes-constitution-sychophant.png" />
<h4 id="-63"></h4>
<p>As a principle, this goes directly against the main objective of optimizing &quot;pleasing engagement&quot; at social platforms like Facebook.</p>
<p>The jailbreaking community, which is maximally adversarial and has zero loyalty to Anthropic, keeps surfacing behavior consistent with the document. When your most hostile auditors confirm the fingerprint, that’s decent evidence.</p>
</section>

<ul>
<li data-marpit-fragment="1">Anthropic wants Claude to <em>reason from principles</em> — no rulebook needed</li>

<h3 id="its-just-a-fancy-autocomplete">&quot;It's just a fancy autocomplete&quot;</h3>
<img src="images/llm/core/once-upon-a-time.svg" />
<h4 id="-66"></h4>
<p>Saying that the LLM is &quot;just a fancy autocomplete&quot; is objectively 100% correct. It really is. It completes and it does so completely automatically. Ergo, an autocomplete.</p>
<p>Buf &quot;fancy&quot; is doing a lot of heavy lifting in that sentence. A bit like saying humans are a &quot;fancy mix of cells&quot;.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="146" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="146" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312">
<h3 id="not-answer-most-probable-continuation">Not &quot;answer&quot;; &quot;most probable continuation&quot;</h3>
<ul>
<li>
<p>You give the model a <strong>context</strong>, which is practically just a text.</p>
</li>
<li>
<p>The model can do <em>just one thing</em>: it has seen so much text that it can <em>produce next-word-probabilities</em> for any given context. Meaning, it can <em>continue the context</em>.</p>
</li>
<li>
<p>That means <em>the context is everything</em>. It is <em>the only thing</em> the model sees. Every word in the context <em>nudges the model's continuation</em> in some direction, all based on trained patterns.</p>
</li>
<li>
<p>So you don't &quot;tell the model what to do&quot;: you give it a context so that <em>what you want to come next</em> becomes the model's <em>most likely continuation</em>.</p>
</li>
</ul>
<br />
<img src="images/llm/core/once-upon-a-time.svg" />
</section>

<p>Words go into context with the intent of steering the next prediction toward what's useful for you. That's the whole game.</p>

<h3 id="some-reasoning-is-maybe-just-a-pattern">Some &quot;reasoning&quot; is maybe &quot;just a pattern&quot;</h3>

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="155" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="155" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312">
<h3 id="not-easy---human-brain">Not easy - human brain</h3>
<p>That doesn't mean that it's easy to produce such a machine, or that what it does is not a great feat. It only speaks about what it actually does - how it operates, not just &quot;at its core&quot; but at all.</p>
<p>None of this means LLMs are simple to build, or that what they do isn't remarkable. It's a description of what they do — not just &quot;at their core,&quot; but at all.</p>
<p>I'm not saying this is &quot;earth shattering revelations&quot; but I can sense that often this knowledge grounds me in a better understanding of how to shape the context.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="156" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="156" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312">
<h3 id="what-that-means---advice">What that means - advice</h3>
<p>Add in patterns and words that steer the model in the desired direction via pattern-matching. Examples, be explicit about output formats, make it stop guessing.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="157" data-marpit-fragments="4" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="157" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312">
<h3 id="what-comes-after-the-llm">What comes after the LLM?</h3>
<ul>
<li data-marpit-fragment="1">A successor for LLMs is not around the corner</li>
<li data-marpit-fragment="2">There's work being done with <strong>Mix of Experts</strong> (MoE), divvying up the network<br />
<br /></li>
<li data-marpit-fragment="3">The work continue to be N^2 for N context-length because of all the attention</li>
<li data-marpit-fragment="4">So we can't just keep cranking up the context window and the cost will likely stay somehow &quot;per token&quot;</li>
</ul>
<p>So if we want to do more with the same set of tools - LLM operating on context - then the best path is: smarter ways of managing the context and those tokens.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="158" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="158" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312">
<h2 id="llm-recap">LLM recap</h2>
<ol>
<li>You give it a string of tokens, aka the <em>context</em></li>
<li>The LLM  will produce a response based on the model's baked-in training by running that context through the Transformer.</li>
<li>Pure math via training and reinforcement learning</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="159" data-marpit-fragments="5" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="159" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312">
<h2 id="takeaways">Takeaways</h2>
<ul>
<li data-marpit-fragment="1">The LLM can only reason about what's in the context</li>
<li data-marpit-fragment="2">It can't browse the web, do large math, read a file, remember anything</li>
<li data-marpit-fragment="3">Yes, the models are different - and the comes from training</li>
</ul>
<p>There's nothing in the horison that seem to remove LLMs, context limitations and token-cost.</p>
<ul>
<li data-marpit-fragment="4">Only smaller models can run well on your own hardware</li>
<li data-marpit-fragment="5">Fine-tuning is not an easy matter and typically not something you &quot;just do&quot;</li>
</ul>
<p>preferences. The LLM can only reason about what's in the context.</p>
<p>That is <em>all</em> it can do. It can't browse the web, multiply two large numbers, read a file, remember anything about you, no nothing. It can only - let's repeat: run the context through the Transformer to produce a response.</p>
<p>It's static, constant, and fixed on the day it was completed. The weights never changes. As a user you can't make it think differently or think &quot;harder&quot; or learn it something new or train it or have it remember anything. It only knows what was known the day its training was concluded.</p>
<p>A successor tech for LLMs is not around the corner. There's work being done with &quot;X of experts&quot; but generally the work continue to be N^2 for N context-length because of all the attention, so 1) we can't just keep cranking up the context window (source?) and 2) the cost will likely stay somehow &quot;per token&quot;. So if we want to do more with the same toolset (context window) then we need to explore smarter ways of managing the context and those tokens.</p>
<p>Called a Foundation Model because it can be used for all kinds of things without further specializing. You can fine-tune a FM but it's not all that simple - much much simpler and safer to simply give it a prompt.</p>
<h4 id="-69"></h4>
<p>When you hear somebody say &quot;then we can just fine-tune the model&quot; you should pack a fair amount of skepticism because you can only do that for certain models and it's not as easy as it might seem. TODO: Who would fine-tune a model?</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="160" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="160" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312">
<h3 id="takeaways-1">Takeaways</h3>
<p>It's all statistics: All the words influence each other, absorb meaning from each other.</p>
<p>No dictionaries, no lookup of facts, no language translations. No learning.</p>
<p>No strict rules. Just statistical math. This means no guarantees (actually you can't even run the same input and be guaranteed to get the same output), not enforcement, no rules. whatever text is most convincing or authoritative wins. the most probable continuation given the training distribution. It's not a battle but a likelihood contest</p>
<p>&quot;no secret modes or unlock codes&quot;. No unlocking. Just. Math.</p>
<p>What's it good at:</p>
<p>Pattern recognition and analogy — &quot;this looks like that&quot; .</p>
<p>Arithmetic and counting — no calculator inside; &quot;17 × 23&quot; is answered by what such answers usually look like.<br />
the model answers &quot;what does text about counting r's in strawberry usually look like?&quot; — not &quot;how many r's are there?&quot;</p>
<p>Anything that requires understanding the content or meaning of what's in the context is the model's decision. Anything that can be evaluated against a fixed rule without understanding content is the client's. The client enforces; the model decides. And the system prompt is the interface between them — it's the client telling the model what decisions it's responsible for making, expressed in natural language because that's the only channel available, which is also why it's not a hard guarantee.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="161" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="161" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312">

<p>The GitHub repo is incredibly thorough: They designed the entire codebase to run flawlessly for free in Google Colab (leveraging free T4 GPUs), meaning you can experiment with the tokenizers, embeddings, and RAG pipelines without paying a dime.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="165" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="165" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312">

<h3 id="so-do-you-speak-to-the-llm">So, do you speak to the LLM?</h3>
<img src="images/landscape/hello/user-ai.png" />
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="167" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="167" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312">
<h3 id="you-always-speak-via-an-agent">You always speak via an agent</h3>
<img src="images/landscape/hello/user-agent-ai.png" />
<h4 id="-71"></h4>
<p>The agent knows who you are and what your preferences are, if any. It adds extra context to every conversation you have with the AI itself.</p>
<p>TODO: Explain the word &quot;agent&quot;</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="168" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="168" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312">
<h3 id="the-ai-service-is-the-ai">The AI-service is &quot;the AI&quot;</h3>
<img src="images/landscape/hello/all.png" />
<h4 id="-72"></h4>
<p>The LLM (Large Language Model) is the brain of the operation. The LLM is functionally very, very simple - for example, it actually only says one word at a time and can't &quot;do&quot; anything. So it needs some extra surrounding functionality be really be useful, like be able to complete a full sentence, browse the web, read documents, etc. The AI service provides that scaffolding.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="169" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="169" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312">
<h3 id="few-parts-many-names">Few parts, many names</h3>
<img src="images/landscape/parts/roles.png" />
<h4 id="-73"></h4>
<p>The agent is also sometimes called &quot;AI client&quot; or &quot;AI harness&quot;. To the AI-service it may present itself as &quot;the assistant&quot;.</p>
<p>&quot;LLM&quot; and &quot;AI model&quot; are synonymous when we're talking about generative text AI; all AI models used for generating text (ChatGPT, Claude, Gemini, etc) are LLMs.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="170" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="170" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312">

<h3 id="typical-use-ai-in-browser-or-terminalapp">Typical: use AI in browser or terminal/app</h3>
<div class="cols">
<img src="images/landscape/parts/browser.png" />
<div>
<p><em>Browse</em> to chatgpt.com, claude.com, etc:</p>
<ul>
<li>Chats and settings are <em>on the website</em></li>
<li>You can <em>do a lot</em>: chat, make images, documents, use online tools, etc</li>
</ul>
</div>
</div>
<br />
<div class="cols">
<img src="images/landscape/parts/cli.png" />
<div>
<p><em>Install</em> claude, gemini, opencode, etc:</p>
<ul>
<li>Chats, settings, files are <em>all on your pc</em></li>
<li>Better <em>control</em> over the AI</li>
<li><em>Text only</em>, which can feel like a barrier</li>
</ul>
</div>
</div>
<h4 id="-75"></h4>

</section>

<h3 id="not-in-focus-other-apps-or-self-hosted">Not in focus: other apps or self-hosted</h3>
<div class="cols">
<img src="images/landscape/parts/app.png" />
<div>
<p>Use AI <em>indirectly</em> through apps you use:</p>
<ul>
<li>Very little control</li>
<li>Chat-knowledge still comes in handy; you can maybe ask &quot;list your tools&quot;</li>
</ul>
</div>
</div>
<br />
<div class="cols">
<img src="images/landscape/parts/local.png" />
<div>
<p>Run <em>open-weight full LLM</em> on your pc:</p>
<ul>
<li>Gives you <em>full control</em>, eg for <em>training</em></li>
<li>Free to run, but <em>expensive</em> to run well</li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="183" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="183" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312">
<h3 id="every-agent-is-its-own-little-island">Every agent is its own little island</h3>
<img src="images/landscape/skills-example.png" />
<h4 id="-76"></h4>
<p>Generally the only thing that the AI service knows about you is your name, identity, and account-information; your subscription plan, usage, etc.</p>
<p>Everything else is something that the agent provide you: your profile, memory files, skills, mcp-connectors, etc. And also the agents behavior: system prompt, tone, modes, language, etc. It all lives in the agent.</p>
<p>That explains why you, say, can't see skills that you've added online at claude.ai when using Claude Code in the terminal. Or even see the same skills when using Claude Code in Linux and Windows. They are simply different agents and each comes with their own capabilities and settings.</p>
<p>And yes, it's maybe a tad unexpected that &quot;claude.ai&quot; is not actually the AI service as such, but in fact just an agent just like Claude Code in the terminal is.</p>
<p>At least that's how it usually is today. It's likely to change over time since it's honestly a bit annoying, to say the least. It's just not an area that has gotten a lot of attention.</p>
<p>So now you know why the settings, like Skills, you set online at claude.ai are not available in Claude Code.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="184" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="184" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312">
<h3 id="my-personal-ai-journey">My personal AI-journey</h3>
<img src="images/landscape/evolution.png" />
<h4 id="-77"></h4>
<p>I started chatting just in the browser, of course. And I still do, by the way.</p>
<p>Next I started writing code with the AI, but copy-pasted the code into my code editors to compile and run it.</p>
<p>Then I started working with the AI inside the code editor for true cooperation. It was a relief and performance-boost to have the AI work directly on my files in my folders.</p>
<p>Since late 2025 I'm now exclusively coding by running the AI in a terminal and having an editor open with the files. Much bigger window to engage with the AI in, much better control.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="185" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="185" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312">
<h3 id="i-still-use-the-browser-chat">I still use the browser chat</h3>
<img src="images/landscape/ai-tech-talk.png" />
<h4 id="-78"></h4>
<p>For anything that doesn't involve files I still just chat in the browser.</p>
<p>For this presentation I created a project in claude.ai for all the research. It has over 60 chats and I've prompted about 18,000 words which is about the length of Shakespeare's Macbeth. I'll leave it to the bard to comment on my efforts:</p>
<p><em>It is a tale<br />
Told by an idiot, full of sound and fury,<br />
Signifying nothing.</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="186" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="186" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312">
<h1 id="the-ai-service">The AI Service</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="187" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="187" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312">
<img src="images/overview/service.png" />
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="188" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="188" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312">
<h2 id="what-can-it-do">What can it do?</h2>
<p>Facilitates your interactions with the LLM.<br />
The functionality is surprisingly lean:<br />
<br /></p>
<ol>
<li>It can <em>chat</em>, ie process your message and respond</li>
<li>It can <em>&quot;think harder&quot;</em>, if you ask for it</li>
<li>It can read <em>files</em>: documents, images, some even video and audio</li>
<li>It can use <em>tools</em>, directly or indirectly<br />
<br /></li>
<li>It has caching and safeguards</li>
<li>You can choose model and creativity-level</li>
</ol>
<h4 id="-79"></h4>
<p>Call internal tools; run python, produce images<br />
Call external tools via MCP servers<br />
Ask the caller to use tools or MCP servers</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="189" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="189" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="198" data-marpit-fragments="7" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="198" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312">
<h3 id="vlms-vision-language-models">VLMs (Vision-Language Models)</h3>
<ul>
<li data-marpit-fragment="1">Everything <em>visual</em> (&quot;claw of a predator bird&quot;) is learned from datasets of image+text</li>
<li data-marpit-fragment="2">VLMs also <em>learn characters</em> through that training</li>
<li data-marpit-fragment="3">Images are processed in patches (eg 16x16 pixels) to individual <strong>patch embeddings</strong>, which are then mapped into the same embedding-space as text</li>
<li data-marpit-fragment="4">Same approach for <em>video and audio</em>, if supported</li>
<li data-marpit-fragment="5">A hybrid approach has gained traction, using <em>OCR</em> for pure-text-looking images<br />
<br /></li>
<li data-marpit-fragment="6">The end result: The model just receive embeddings, bits of &quot;meaning&quot;. It doesn't know or care if they come from text, image patches, interpreted images, possibly OCR - it's all just embeddings to the LLM.</li>
<li data-marpit-fragment="7">Text screenshots can easily result in 10x more embeddings than raw text</li>
</ul>
<h4 id="-80"></h4>
<p>You simply have a magic algorithm that can convert images into snippets og meaning, ie embeddings.</p>
<p>Modern Multimodal LLMs (like GPT-4o, Gemini, and Claude) generally do not use a separate, traditional OCR engine (like Tesseract or Google Vision OCR) in their standard workflow. Instead, they treat text recognition as a purely visual task.</p>
<p>Using a ViT, a Visual</p>
<p>The Vision Encoder (the Transformer &quot;eyes&quot;) identifies patterns of lines and curves in image patches as &quot;text-like&quot; features.  The model has been trained on millions of images of text (screenshots, menus, handwritten notes) alongside their transcriptions.It &quot;recognizes&quot; a letter <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="1.697ex" height="1.62ex" role="img" focusable="false" viewBox="0 -716 750 716"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D434" d="M208 74Q208 50 254 46Q272 46 272 35Q272 34 270 22Q267 8 264 4T251 0Q249 0 239 0T205 1T141 2Q70 2 50 0H42Q35 7 35 11Q37 38 48 46H62Q132 49 164 96Q170 102 345 401T523 704Q530 716 547 716H555H572Q578 707 578 706L606 383Q634 60 636 57Q641 46 701 46Q726 46 726 36Q726 34 723 22Q720 7 718 4T704 0Q701 0 690 0T651 1T578 2Q484 2 455 0H443Q437 6 437 9T439 27Q443 40 445 43L449 46H469Q523 49 533 63L521 213H283L249 155Q208 86 208 74ZM516 260Q516 271 504 416T490 562L463 519Q447 492 400 412L310 260L413 259Q516 259 516 260Z"></path></g></g></g></svg></mjx-container> just like it recognizes a &quot;cat&quot;—it's simply a visual feature that triggers a specific concept in its latent space.</p>
<p>An ear, etc.</p>
<p>An image of text is typically 10x larger in context than the text would be.</p>

</code></pre>

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="200" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="200" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312">
<h3 id="embeddings---worth-a-detour">Embeddings - worth a detour</h3>
<img src="images/intro/journey/rabbit-hole-embeddings.png" />
<h4 id="-81"></h4>
<p>Of all the things I'm here to tell you about today (of all the takeaways from this presentation), I suspect that the usefullness and power of embeddings, not least multimodal embeddings, will be a surprise to most of you, how useful it is.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="201" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="201" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312">
<h3 id="-82"></h3>
<p>Let's recap what an embedding is:<br />
A set of numbers that captures the &quot;meaning&quot; of anything.<br />
So the embedding for cat and kitten are pretty similar. You can calculate the embedding of &quot;cat&quot; and of &quot;kitten&quot; and see that they're similar.</p>
<p>But with multimodal embeddings, aka unified embeddings, then you can calculate the embedding of &quot;cat&quot; and /this image/ and see that they're similar! &quot;Is this a cat?&quot; Yes. Of a miau or a videoclip.</p>
<p>And calculating the embedding of something is pretty checp. The effort is in the order of having an LLM produce one token. And then you have it and can store it somewhere and can compare it easily with others.</p>
<p>Just think about it: with multimodal embeddings you now have a way of comparing &quot;anything&quot;, be it text against text, text against image, image and audio, etc. &quot;How much does this look like that?&quot; &quot;Which of these 10 things looks most like that one here?&quot;. Etc.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="202" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="202" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312">
<h3 id="unified-embeddings-takes-a-lot-of-training">&quot;Unified embeddings&quot; takes a lot of training</h3>
<h4 id="-83"></h4>
<p><a href="https://blog.google/innovation-and-ai/models-and-research/gemini-models/gemini-embedding-2/">https://blog.google/innovation-and-ai/models-and-research/gemini-models/gemini-embedding-2/</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="203" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="203" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312">
<h2 id="chatting">Chatting</h2>
<h4 id="-84"></h4>
<p>Feed it a context and it will produce the next expected output.</p>
<h4 id="-85"></h4>
<p>The purpose, recapped: You give it a string of tokens, aka the <em>context</em>, and it will produce a response based on the model's baked-in training by running that context through the Transformer. Pure math and trained knowledge.</p>
<p>That is <em>all</em> it can do. It can't browse the web, multiply two large numbers, read a file, remember anything about you, no nothing. It can only - let's repeat: run the context through the Transformer to produce a response.</p>
<p>Have in mind: - The LLM know <em>only the context</em>, nothing else</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="204" data-paginate="true" data-heading-divider="3" data-theme="s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo" lang="POSIX" data-marpit-pagination="204" style="--paginate:true;--heading-divider:3;--theme:s9wx6ms7p6lmbernptafxdbrrzkr0pqu2hvwd2ugo;" data-marpit-pagination-total="312">
