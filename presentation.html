<h3 id="total-123n--on%C2%B2-messages">Total: 1+2+3+...N = O(N²) messages</h3>
<img src="images/service/chat/tokens-turn-50-total.png" />
<h4 id="-93"></h4>
<p>It gets more and more expensive to keep on dragging the entire conversation along.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="213" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="213" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<h3 id="todo-show-userassistant-turns-and-special-tokens">TODO: Show user/assistant turns and special tokens</h3>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="214" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="214" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<h2 id="think-harder">&quot;Think harder&quot;</h2>
<img src="images/overview/thinking.png" />
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="215" data-marpit-fragments="4" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="215" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<h3 id="what-could-think-harder-mean">What could &quot;think harder&quot; mean?</h3>
<ul>
<li data-marpit-fragment="1">
<p>Maybe the model's billions of weights can be tweaked to somehow &quot;think better&quot;?<br /><em>Hmm, no - the LLM weights are constant numbers, frozen after training.</em></p>
</li>
<li data-marpit-fragment="2">
<p>So maybe thinking call on some &quot;bigger AI&quot;, stashed away in the back room?<br /><em>But then how could the biggest models think harder too? No, the hardware and model is fixed.</em></p>
</li>
<li data-marpit-fragment="3">
<p>Thinking could mean the LLM plan better when asked to think harder?<br /><em>No wait, the transformer is pure math, acting the same way for the same input.</em></p>
</li>
<li data-marpit-fragment="4">
<p>Ah, now I have the full picture. Is what we do here, refining the output, thinking?<br /><em>That's a bingo!</em></p>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="216" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="216" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<h3 id="thinking-is-think-append-repeat">Thinking is: think, append, repeat</h3>
<img src="images/service/overview/thinking.png" />
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="217" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="217" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<h3 id="chain-of-thought">Chain of Thought</h3>
<p>Thinking is called <strong>Chain of Thought</strong>, or <strong>CoT</strong><br />
 <br />
The feature has many names (e.g. <em>effort</em>) but <em>always works this way</em>:<br />
 </p>
<ol>
<li>Inject a special <em><let me think about that>-token</em>, known from training</li>
<li>That token makes the LLM <em>comtemplate</em>, rather than seek to respond</li>
<li>Keep producing, appending, and processing <strong>thinking blocks</strong>, refining the LLM's understanding of the matter until it says &quot;thinking completed&quot; or the allotted <strong>thinking budget</strong> is exceeded</li>
<li>Blocks are also sent to the agent, which may show them to you</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="218" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="218" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<h3 id="writing-ultrathink-is-a-myth-now">Writing &quot;ultrathink&quot; is a myth now</h3>
<img src="images/service/thinking/ultrathink.png" />
<h4 id="-94"></h4>
<p>This was how Claude controlled the thinking in early days.</p>
<p>But not anymore.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="219" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="219" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<h3 id="you-control-the-thinking-effort">You control the thinking effort</h3>
<img src="images/service/thinking/claude-code-enable-thinking.png" />
<h4 id="-95"></h4>
<p>You can enable thinking in all kinds of manners.</p>
<p>Nowadays, it's often simply enabled by default, or even automatically controlled.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="220" data-marpit-fragments="3" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="220" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<h3 id="a-penny-for-your-thoughts">A penny for your thoughts</h3>
<ul>
<li data-marpit-fragment="1">Thinking-blocks are output tokens, and then input-tokens, so they cost you, too.<br />
 </li>
<li data-marpit-fragment="2">For reasoning-heavy tasks, thinking tokens can therefore easily multiply your effective output costs by 10x.<br />
 </li>
<li data-marpit-fragment="3">However, thinking-blocks are (typically) <em>not included</em> in the context after this turn, even though the agent's UI may still show them. Only the final response <em>after the thinking</em> is kept in the context for the next turns.</li>
</ul>
<img src="images/service/thinking/claude-code-thinking.png" />
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="221" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="221" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<h3 id="thinking-blocks-can-be-interesting">&quot;Thinking blocks&quot; can be interesting</h3>
<img src="images/service/thinking/now-i-understand.png" />
<h4 id="-96"></h4>
<p>Thinking generally produce a better result and the model can catch itself if it's going down the wrong path.</p>
<p>However, it can possibly also strengthen a misbelief.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="222" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="222" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<h3 id="thinking-typically-improves-the-response">Thinking typically improves the response</h3>
<img src="images/service/thinking/haiku.png" />
<h4 id="-97"></h4>
<p>Without &quot;Extended thinking&quot;, the LLM failed to produce a proper Haiku. A rhyming format such as a Haiku is hard for the LLM to produce just one token at a time.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="223" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="223" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<h2 id="tools">Tools</h2>
<img src="images/overview/tools.png" />
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="224" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="224" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<h3 id="remember-the-math-example">Remember the math-example?</h3>
<img src="images/llm/core/math.svg" />
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="225" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="225" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<h3 id="the-llm-can-ask-to-use-tool-xxx">The LLM can ask to &quot;use tool xxx&quot;</h3>
<img src="images/service/overview/tools.png" />
<h4 id="-98"></h4>
<p>Meaning: The LLM can choose to produce output that is asking for a tool to be run, and the output from that tool will then be added to the context, practically as if the user had added it themselves.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="226" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="226" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<h3 id="calculate-12344287389398790237342">&quot;calculate 123442873893*98790237342&quot;</h3>
<img src="images/service/tools/python-math-example/request.png" />
<h4 id="-99"></h4>
<p>You, the user, says to the AI: &quot;please calculate 123442873893*98790237342&quot;.</p>
<p>The agent always send info about tools that are available. In a break from what we've seen so far, the server can actually <em>also add some tools</em> that the LLM can run. For instance, Anthropic's AI server has a Linux environment with Python interpreters and can fetch web-pages without having to delegate that effort back to the agent.</p>
<p>In this situation there's a tool called &quot;code_interpreter&quot; with the description &quot;Executes Python code and returns the result&quot;, taking a string-argument of Python code. <strong>Python</strong> is a popular programming language that the LLM during training has seen millions of examples of.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="227" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="227" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<h3 id="llm-asks-to-use-tool-code_interpreter">LLM asks to use tool &quot;code_interpreter&quot;</h3>
<img src="images/service/tools/python-math-example/tool-use.png" />
<h4 id="-100"></h4>
<p>Based on the training, the LLM decides that the best continuation from the user saying &quot;please calculate 123442873893*98790237342&quot; is to call a suitable tool that can do math. The &quot;code_interpreter&quot; seems like such a suitable tool.</p>
<p>So the LLM's output asks for a &quot;tool_use&quot; of that tool, conjuring up the suitable Python code snippet <code>print(123442873893 * 98790237342)</code> from its massive training on Python code.</p>
<p>As an aside: the tool-training is commonly done using a process called <em>Toolformer</em>.</p>
<h4 id="-101"></h4>
<p>How did the LLM learn to use tools?</p>
<p>In <em>Toolformer</em>, Schick et al. had a base LM propose where API calls might go in ordinary text, then actually executed those calls, and kept an insertion only if having the call and result demonstrably helped predict what came next (reduced the model's loss on subsequent tokens). The process is self-supervised: usefulness is not defined by human judgement but purely mathematically as &quot;did this make the future more predictable?&quot;.</p>
<p><a href="https://www.youtube.com/watch?v=LxZ3gYvbV7I">Toolformer: AI learns to use APIs - AssemblyAI</a>  (5 min)<br />
<a href="https://www.youtube.com/watch?v=UID_oXuN-0Y">Timo Schick | Toolformer: Language Models Can Teach Themselves to Use Tools</a> (55 min)<br />
<a href="https://arxiv.org/pdf/2302.04761">Toolformer: Language Models Can Teach Themselves to Use Tools</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="228" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="228" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<h3 id="the-tools-is-being-run-on-agent-or-server">The tools is being run (on agent or server)</h3>
<img src="images/service/tools/python-math-example/tool-result.png" />
<h4 id="-102"></h4>
<p>If the tool is server-side then the server runs it. Otherwise it goes all the way back to the client. As mentioned, running Python code or fetching webpages is typically done by the server. Reading or creating local files can of course only be done by the agent on the user's computer.</p>
<p>At any rate, the tool runs, the output is added to the context, and the new context is passed back into the LLM for another pass.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="229" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="229" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<h3 id="finally-the-ai-service-can-respond">Finally, the AI service can respond</h3>
<img src="images/service/tools/python-math-example/response.png" />
<h4 id="-103"></h4>
<p>With that added context from the tool, the LLM can finally produce a nice and correct answer.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="230" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="230" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<h3 id="the-anatomy-of-a-tool-definition">The anatomy of a tool definition</h3>
<img src="images/service/tools/tools-list.png" />
<h4 id="-104"></h4>
<p>Every tool speficies the name of the tool, a description of what the tool does, and details on how to call it.</p>
<p>The information is quite verbose and detailed so the LLM can make sane decisions on whether calling the tool would be useful or not. Of course, in order for the LLM to see it, the tool-information will need to actually be part of the context - how else would the LLM know about it?</p>
<p>So tools can take up a fair chunk of the context.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="231" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="231" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<h3 id="tools-the-so-called-agentic-loop">Tools: the so-called &quot;agentic loop&quot;</h3>
<img src="images/service/tools/the-agentic-loop.png" />
<h4 id="-105"></h4>
<p><a href="https://code.claude.com/docs/en/agent-sdk/agent-loop">How the agent loop works</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="232" data-marpit-fragments="16" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="232" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<h3 id="the-llm-is-in-control---via-tools">The LLM is in control - via tools</h3>
<p>Tools serve much more than just doing math, file, or web operations.<br />
 <br />
Practically every <em>decision</em> in the interaction you have with the agent and AI service, is actually <em>conjured up by the LLM</em>. The agent and service is predominantly simply carrying out the LLM's bidding about practically everything:<br />
<br /></p>
<div class="cols">
<div>
<ul>
<li data-marpit-fragment="1">Calling tools</li>
<li data-marpit-fragment="2">Asking the user</li>
<li data-marpit-fragment="3">Planning vs doing</li>
<li data-marpit-fragment="4">Orchestrating agents</li>
</ul>
</div>
<div>
<ul>
<li data-marpit-fragment="5">Parallel vs sequential tool calls</li>
<li data-marpit-fragment="6">What to remember</li>
<li data-marpit-fragment="7">Whether to trust a result</li>
<li data-marpit-fragment="8">When to stop</li>
</ul>
</div>
</div>
<h4 id="-106"></h4>
<ul>
<li data-marpit-fragment="9">
<p><em>Calling tools</em>: Which tool, with what inputs, and whether to call several in parallel or sequentially. If two tools could both answer a question, the model picks.</p>
</li>
<li data-marpit-fragment="10">
<p><em>Asking the user</em>: When ambiguity is worth resolving vs just attempting. The model decides whether a question is clarifying or unnecessary interruption.</p>
</li>
<li data-marpit-fragment="11">
<p><em>Planning vs doing</em>: Decomposing a task into steps first, or just starting. Related: how many steps, in what order.</p>
</li>
<li data-marpit-fragment="12">
<p><em>Orchestrating agents</em>: Spawning subagents, assigning subtasks, deciding when verification by a second agent is worth the cost.</p>
</li>
<li data-marpit-fragment="13">
<p><em>Parallel vs sequential tool calls</em>: If the client supports parallel tool use, the model decides which calls are independent enough to run simultaneously vs which must wait for a prior result.</p>
</li>
<li data-marpit-fragment="14">
<p><em>What to remember</em>: If given a memory tool, the model decides what's worth storing, what to overwrite, and what to let expire. Surprisingly consequential over long sessions.</p>
</li>
<li data-marpit-fragment="15">
<p><em>Whether to trust a result</em>: After a tool returns, the model decides whether the result looks plausible or whether to sanity-check it via a second tool or its own reasoning. A search result that seems off might trigger a follow-up search.</p>
</li>
<li data-marpit-fragment="16">
<p><em>When to stop</em>: In an agentic loop, the model decides when the task is genuinely done vs when it should keep going. end_turn is its call, and getting this wrong in either direction is a real failure mode.</p>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="233" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="233" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<h3 id="example-starting-background-workers">Example: starting background workers</h3>
<img src="images/service/tools/background-worker.png" />
<h4 id="-107"></h4>
<p>The agent simply has to provide a named tool, a mechanism, for running background agents.</p>
<p>The agent is not the one making the decision when to actually <em>run</em> another background agent: it is <em>the LLM</em> that makes that decision.</p>
<p>So in a way it's &quot;easy&quot; to write an agent: just provide well-described, nearly &quot;mechanical&quot; tools, that the LLM can work with: like &quot;ask the user&quot;, &quot;delete a file&quot;, &quot;start multiple agents&quot;, etc.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="234" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="234" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<h3 id="the-home-field-advantage">The home-field advantage</h3>
<p>Models are trained on their own lab's tools.<br />
 <br />
When Claude runs inside Copilot, the tools Copilot hands it don't match what Claude was trained on. Claude can generalise, but the fine-tuned judgment of when and how to use each primitive doesn't transfer perfectly. The agentic loop works the best when a model interacts with its buddy: the agent it's been trained with.<br />
 <br />
That's why running <em>Claude Opus in Claude Code</em> can feel more smooth than running Opus inside <em>Copilot, Cursor, Perplexity,</em> or <em>OpenCode</em>. It's just a better fit.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="235" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="235" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<h3 id="i-did-the-thing-no-you-didnt">&quot;I did the thing&quot; No, you didn't?</h3>
<p>TODO: make a drawing of this<br />
Sometimes the AI will say &quot;I did the thing&quot;, eg &quot;I wrote the file&quot;.</p>
<p>But - nothing was written. Why does it lie? Stupid LLM.</p>
<p>Remember, the LLM just ask for the tool to be used, e.g. writing to a file. If the agent or tool fail somehow and the LLM isn't notified then the LLM merrily believes all was okay.</p>
<p>It seems to rarely happen anymore but when it does, then this is why.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="236" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="236" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<h3 id="ask-the-ai-what-tools-do-you-have">Ask the AI: &quot;what tools do you have?&quot;</h3>
<img src="images/service/tools/rovo-ask-what-pages-tools.png" />
<h4 id="-108"></h4>
<p>Simply asking what tools are available can be a good way of finding inspiration for how to use that AI.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="237" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="237" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<h3 id="example-rovo-using-its-atlassian-tools">Example: Rovo using its Atlassian tools</h3>
<img src="images/service/tools/rovo-ask-how-many-pages.png" />
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="238" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="238" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<h3 id="how-many-pages-are-in-my-own-space">&quot;How many pages are in my own space?&quot;</h3>
<img src="images/service/tools/rovo-ask-how-many-pages.png" />
<h4 id="-109"></h4>
<p>Rovo does a number of tool calls to figure out that I have three pages in my personal Confluence space.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="239" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="239" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<h2 id="mcp-servers">MCP servers</h2>
<img src="images/overview/tools.png" />
<h4 id="-110"></h4>
<p>Hang on, this looks exactly like the highlighting of &quot;tools&quot;?</p>
<p>Yes, that's right.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="240" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="240" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<h3 id="mcp-servers-simply-gives-you--more-tools">MCP servers simply gives you ... more tools</h3>
<img src="images/service/overview/mcp.png" />
<h4 id="-111"></h4>
<p>MCP is a standardized way of giving the LLM access to tools outside the agent or server.</p>
<p>In principle <em>it works exactly like tools</em> that we've just covered.</p>
<p>The only difference is that the list of tools isn't baked into the agent or server, but instead fetched live from the MCP server. And should the LLM decide to use one of the tools then yes, that same MCP server is what will handle the tool-call.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="241" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="241" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<h3 id="mcp-servers-gives-uniform-access-to-tools">MCP servers gives uniform access to tools</h3>
<img src="images/service/mcp/uniform-mcp-interface.png" />
<h4 id="-112"></h4>
<p>Having just one standard for using outside tools is a great advantage. The agent or server does not need to figure out how to seet what API services are available in many different ways. There's now just one way; the MCP protocol way: ask for tool-names and call a tool.</p>
<p><a href="https://modelcontextprotocol.io/specification/">Model Context Protocol Specification</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="242" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="242" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<h3 id="an-mcp-server-is-an-api-facade">An MCP server is an API facade</h3>
<p>An MCP server <em>does not itself bring new functionality into the world</em>.<br />
 <br />
It's a middleman, <em>a standardized protocol</em>, that enable the AI to discover a service that exists somewhere.<br />
 <br />
So when you hear somebody say e.g. <em>&quot;You can add an MCP server for Atlassian&quot;</em> you should really think: <em>&quot;I can tell the AI how to call Atlassian's API (&quot;tools&quot;)&quot;</em>.<br />
 <br />
The <em>agent/server always call the MCP server</em>, never the other way around.</p>
<h4 id="-113"></h4>
<p>Yes, it's really &quot;just that&quot;. A live list of tools.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="243" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="243" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<h3 id="example-atlassian-mcp">Example: Atlassian MCP</h3>
<img src="images/service/mcp/atlassian-mcp-ask-how-many-pages.png" />
<h4 id="-114"></h4>
<p>Adding the Atlassian MCP server give me access to some of the same page-tools that Rovo used in the tools examples.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="244" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="244" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<h2 id="mcp-tool-call-in-detail">MCP tool-call in detail</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="245" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="245" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<h3 id="first-add-the-mcp-server-info-to-the-agent">First, add the MCP server info to the agent</h3>
<img src="images/service/mcp/flow/1-add-server.png" />
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="246" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="246" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<h3 id="you-only-need-to-do-that-once">You only need to do that once</h3>
<img src="images/service/mcp/flow/2-explain.png" />
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="247" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="247" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<h3 id="the-info-is-present-in-every-request-you-make">The info is present in every request you make</h3>
<img src="images/service/mcp/flow/3-request.png" />
<h4 id="-115"></h4>
<p>The agent, or more likely server, will fetch the list of tools from the MCP servers and cache them.</p>
<p>Then it will add information about each MCP server tool to the context.</p>
<p>It <em>used</em> to be that the full information was added to the context, but that simply became too big. So the modern behavior is actually only to add the tool-name which can be maximum 64 characters, and that name is the only guidance the LLM will get.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="248" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="248" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<h3 id="add-full-info-if-the-llm-want-to-use-a-tool">Add full info if the LLM want to use a tool</h3>
<img src="images/service/mcp/flow/4-tool-search.png" />
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="249" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="249" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<h3 id="llm-decides-mcp-server-calls">LLM decides, MCP server calls</h3>
<img src="images/service/mcp/flow/5-tool-use.png" />
<h4 id="-116"></h4>
<p>The AI is talking to an MCP server, which is turn call some API. The MCP server acts on your behalf, authenticated with your personal API key that gives it the same access you would have.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="250" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="250" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<h3 id="the-llm-can-now-respond">The LLM can now respond</h3>
<img src="images/service/mcp/flow/6-response.png" />

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="251" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="251" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="253" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="253" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<h3 id="in-1-hour-the-demo-mcp-server-was-live">In 1 hour, the demo MCP server was live</h3>
<img src="images/service/mcp/siteimprove/github-source.png" />
<h4 id="-118"></h4>
<p>This was the first time ever I build an MCP server. I Basically told Claude &quot;here's Siteimprove's public API documentation, please build an MCP server for it and suggest where to deploy it&quot;. I ended up deploying it on a free account on <a href="https://www.cloudflare.com/">Cloudflare</a>.</p>
<p>The hardest part was actually that the tool-names were limited to 64 characters and Siteimprove's API's endpoints often exceeded that so the names had to be compacted somewhat, like renaming &quot;quality_assurance&quot; to just &quot;qa&quot;.</p>
<p><a href="https://github.com/ricflams/techtalk-ai-demystified/tree/main/demo/siteimprove-mcp">Siteimprove MCP demo source</a><br />
<a href="https://siteimprove-mcp.ricflams.workers.dev/show_me_what_you_got">Siteimprove MCP demo, live tool list</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="254" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="254" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">

<img src="images/service/mcp/siteimprove/tool-in-openapi-spec.png" />
<img src="images/service/mcp/siteimprove/tool-in-mcp.png" />
</div>
<h4 id="-119"></h4>
<p>The API docs, the OpenAPI spec, and the MCP version of the Siteimprove API's endpoint for <a href="https://api.siteimprove.com/v2/documentation#/Analytics/get_sites__site_id__analytics_content_most_popular_pages">/sites/{site_id}/analytics/content/most_popular_pages</a></p>
<p>The MCP variant looks very much like the existing OpenAPI spec for that endpoint, from which the API documentation is generated.</p>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="263" data-marpit-fragments="3" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="263" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<h3 id="mcp-server-takeaways">MCP server takeaways</h3>
<ul>
<li data-marpit-fragment="1">An MCP server &quot;just&quot; gives the AI tools for some service, somewhere<br />
 </li>
<li data-marpit-fragment="2">Every added MCP server bring the entire list of tool-names into every chat<br />
 </li>
<li data-marpit-fragment="3">Powerful, but is often spoken about as &quot;magic that can do everything&quot;</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="264" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="264" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<h2 id="the-system-prompt">The system prompt</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="265" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="265" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">

<img src="images/service/overview/chat-system.png" />

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="266" data-marpit-fragments="3" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="266" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<h3 id="system-prompt">System prompt</h3>
<p>&quot;System prompt&quot; sure sounds very special and magical.</p>
<p>Well, yes and no.</p>
<ul>
<li data-marpit-fragment="1">A <strong>system prompt</strong> is still <em>just plain text</em></li>
<li data-marpit-fragment="2">The AI agent combine <em>&quot;whatever is useful to tell the LLM&quot;</em> into &quot;system prompts&quot;</li>
<li data-marpit-fragment="3">You could have <em>written this text yourself</em> and just sent it in a prompt (well, sort of)</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="267" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="267" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">

<img src="images/service/system/prompt/json-system-vscode-nowrap.png" />
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="268" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="268" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<h3 id="its-pretty-big">It's pretty big</h3>
<img src="images/service/system/prompt/json-system-vscode-wrap.png" />
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="269" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="269" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<h3 id="the-system-prompt-does-carry-more-weight">The system prompt does carry more weight</h3>
<img src="images/service/system/prompt/training.png" />
<h4 id="-123"></h4>
<p>Through training, the LLM has learned that in case of a conflict between &quot;system&quot; instructions and &quot;user&quot; instructions, it should pay more heed to the system instructions. After all, the system instructions during training embodies the desired behavior and values of the model so the model makers will of course make sure that the system instructions are crafted to express the desired behavior.</p>
<p>This bias towards obeying the system-instructions are therefore baked into the LLM's weights. It is just that: a bias, a trained preference to lean towards, in particular in case of conflicting instructions. Practically <em>nothing is a hard rule</em>: it's all just textual instructions that carry more or less weight.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="270" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="270" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<h3 id="convincing-copilotgpt41-to-change-its-name">Convincing Copilot/GPT4.1 to change its name</h3>
<img src="images/service/system/prompt/i-am-groot.png" />
<h4 id="-124"></h4>
<p>With enough super-urgent persuasion, my user message won over the system prompt.</p>
<p>Gemini 2.5 (back then) was not at all convinced and saw right through the presumed urgency.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="271" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="271" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<h3 id="the-system-prompt-is-composed-by-the-agent">The system prompt is composed by the agent</h3>
<img src="images/service/system/prompt/maximillian.png" />
<h4 id="-125"></h4>
<p>The system prompt is entirely constructed by the agent. That's why you get quite different system prompts and behavior depending on what agent you use. So if you build your own agent then you can construct your own system prompt entirely.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="272" data-marpit-fragments="5" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="272" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<h3 id="the-full-context">The full context</h3>
<img src="images/service/system/layer-of-instructions.png" />
<h4 id="-126"></h4>
<p>This figure illustrate two things:</p>
<ul>
<li data-marpit-fragment="1">the relationship between your chat, the system prompt, and the LLM</li>
<li data-marpit-fragment="2">all the bits an agent typically put into the system prompt</li>
</ul>
<p>The context consists of your prompts and the AI's responses, and the system prompt. As mentioned, the LLM has through training learned to obey system prompt instructions over plain user prompts, so placing instructions in the system prompt (for example in an agent-file) makes them more likely to be followed. For anything that you don't state in the context, the LLM will simply follow trained knowledge and behavior, which becomes better and better over time. Anthropic <a href="https://claude.com/blog/the-new-rules-of-context-engineering-for-claude-5-generation-models">blogged in July 2026</a> that they had removed 80% of the agent system prompt for Claude 5 models because the LLM now works better and many strict rules were unneeded or even counterproductive.</p>
<p>I've grouped the bits that agents put into the system prompt into three parts:</p>
<ul>
<li data-marpit-fragment="3">Red are parts the agents invisibly adds, some of which you can control; your preferred language, for example</li>
<li data-marpit-fragment="4">Green is tools, which in the context typically is <em>a hint</em> of how to bring tools or more context into play: &quot;hey LLM, if you need something related to Siteimprove pages then here's an MCP-call you can try out&quot;</li>
<li data-marpit-fragment="5">Blue are prompts, concrete text, that you write yourself and ask the agent to include in every chat</li>
</ul>
<p>You pay by token and the context has a limited size. The context comes at a cost and agents are therefore quite careful not to include just anything. It will <em>not include</em> earlier chats, browser history, your facebook profile, emails, some super-secretly stored information, etc. Not unless you explicitly (or implicitly via a tool) ask for it - many agents will let you search your chat history, if you ask to.</p>
<p>So when you find yourself wondering &quot;How does it know that...?&quot; or &quot;Why doesn't it know that...?&quot; then this gives you the answer: it knows about these parts and they really aren't a secret in any way.</p>
<p>It's a lot, but let's very briefly go through the 11 parts. And again, remember: all of this included into every chat.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="273" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="273" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">

<h4 id="-132"></h4>
<p>Modes are simply implemented as instructions that tell the LLM to plan or do, for instance.</p>
<p>Nowadays, each mode-change typicaally results in <em>adding a system prompt message</em> instead of changing the base system prompt so the prompt is better cached on the server - more on this later. So a conversation can have many sequential instructions to &quot;enter mode x&quot; and &quot;exit mode x&quot;.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="294" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="294" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<h3 id="611-agent-tools">#6/11: Agent tools</h3>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="295" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="295" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<h3 id="info-about-all-tools-are-included">Info about all tools are included</h3>
<img src="images/service/tools/tools-list.png" />
<h4 id="-133"></h4>
<p>It's quite possible that <em>only the tool's description</em> may be included in the context to save tokens, and that the LLM will have to express an interest in using the tool for the agent (or server) to feed in the full tool definition. That's part of the game of minimizing the up-front cost of tools.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="296" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="296" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<h3 id="711-skills">#7/11: Skills</h3>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="297" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="297" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<h3 id="hey-arent-skills-a-big-deal">Hey, aren't skills a big deal?</h3>
<h4 id="-134"></h4>
<p>Well, yes and no.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="298" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="298" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<img src="images/service/system/skills/trinity.png" />
<h4 id="-135"></h4>
<p>A skill is <em>some expertise, that is loaded when you need it</em>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="299" data-marpit-fragments="7" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="299" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<h3 id="whats-a-skill">What's a skill?</h3>
<ul>
<li data-marpit-fragment="1"><strong>Agent Skills</strong> is an open standard, made by Anthropic and widely supported by agents</li>
<li data-marpit-fragment="2">A skill is <em>text instructions</em> with a name</li>
<li data-marpit-fragment="3">After you install a skill, those instructions can be loaded into the context on demand</li>
<li data-marpit-fragment="4">The <em>on demand</em> is done by either you or the LLM:
<ul>
<li data-marpit-fragment="5">In a terminal agent you can type <code>/skill-name</code></li>
<li data-marpit-fragment="6">In a web chat you just ask something like <em>&quot;use skill xxx to ...&quot;</em></li>
<li data-marpit-fragment="7">The skill has a description and the LLM can ask to load the skill's content when it would seem useful, <em>just like for tools</em></li>
</ul>
</li>
</ul>
<h4 id="-136"></h4>
<p>Links:<br />
<a href="https://agentskills.io/home">Agent Skills Overview</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="300" data-marpit-fragments="2" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="300" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<h3 id="whats-a-skill-concretely">What's a skill concretely?</h3>
<ul>
<li data-marpit-fragment="1">It's essentially a little folder - it can e.g. be distributed as <em>a zip-file</em></li>
<li data-marpit-fragment="2">It <em>must</em> contain a file <code>SKILL.md</code> and <em>it can contain whatever else</em> the skill could need, with no upper limit; texts, files, images, whatever</li>
</ul>
<img src="images/service/system/skills/skill-anatomy.jpg" />
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="301" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="301" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<h3 id="example-matt-pococks-grilling-skill">Example: Matt Pocock's &quot;grilling&quot; skill</h3>
<p>Description:<br /><br />&quot;Grill the user relentlessly about a plan, decision, or idea. Use when the user wants to stress-test their thinking, or uses any 'grill' trigger phrases.&quot;<br />
<br /><br />
<img src="images/service/system/skills/skill-griling.png" /></p>
<h4 id="-137"></h4>
<p>The <code>SKILL.md</code> file has just two required fields, name and description, and a markdown body.</p>
<p>Links:<br />
<a href="https://github.com/mattpocock/skills/tree/main/skills/productivity/grilling">grilling skill</a><br />
<a href="https://github.com/mattpocock">Matt Pocock on Github</a><br />
<a href="https://www.youtube.com/@mattpocockuk/videos">Matt Pocock on Youtube</a><br />
<a href="https://tosea.ai/blog/matt-pocock-skills-claude-code-guide">How to Use Matt Pocock's Skills for Claude Code: A Complete Guide</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="302" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="302" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<h3 id="using-a-skill">Using a skill</h3>
<img src="images/service/system/skills/skill-parts.png" />
<h4 id="-138"></h4>
<p>The name and description is always included in the system prompt.<br />
(Actually, this seems to be a bug, since skills marked <code>disable-model-invocation: true</code> should not be included).</p>
<p>The full content is added as a <code>tool_result</code> message when the user or LLM ask for it.</p>
<p>The content is just text, so it will need to refer to other resources to bring them in. Just like you would do in a text prompt for a file: &quot;use NOTES.md to ...&quot;.</p>
<p>That's it, really: a skill is useful expert knowledge, but in practice it's just a piece of text that you can bring in when you need it.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="303" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="303" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<h3 id="hey-bro">Hey bro</h3>
<img src="images/service/system/skills/bro/bro-skill-code.png" />
<h4 id="-139"></h4>
<p>Some skills are really simple. Like this one called <code>bro</code>:</p>
<p>It literally just writes this message into the context: &quot;Restate your last message. Stop using jargon and speak coherently. State it more simply and concisely, like one human talking to another.&quot;</p>
<p>Links:<br />
<a href="https://github.com/backnotprop/bro">bro</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="304" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="304" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<h3 id="installing-the-bro-skill-for-terminal-agents">Installing the bro skill for terminal agents</h3>
<img src="images/service/system/skills/bro/bro-skill-install.png" />
<h4 id="-140"></h4>

</section>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="307" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="307" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="308" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="308" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="309" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="309" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="310" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="310" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="311" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="311" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">

<h4 id="-146"></h4>
<p>Same one we found before, now for ChatGPT.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="312" data-marpit-fragments="3" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="312" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<h3 id="skills-recapped">Skills, recapped</h3>
<ul>
<li data-marpit-fragment="1">It's &quot;just&quot; snippets of text you or the LLM can ask to insert into the context<br />
 </li>
<li data-marpit-fragment="2">Really useful, though, and certainly not magic<br />
 </li>
<li data-marpit-fragment="3">A bit like &quot;smartphone auto-complete&quot;: write <code>/bro</code> and bro's text is written out</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="313" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="313" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<h3 id="811-mcp-servers">#8/11: MCP servers</h3>
<h4 id="-147"></h4>
<p>We already covered them in detail. But there's one important thing to dig into: what the context include of hints about each tool so the LLM can decide to use it or not.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="314" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="314" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<h3 id="full-tool-description-is-long-eg-500-tokens">Full tool description is long, eg 500 tokens</h3>
<img src="images/service/system/mcp/tool-definition.png" />
<h4 id="-148"></h4>
<p>It used to be rather expensive to include tools from MCP servers, because the full tool definition for all tools would be added to the context. Adding an MCP server could eat up 50K or more or the context, about 500 tokens per tool. The 500+ tools in the Siteimprove demo MCP service would fill about 250,000 tokens - crazy, of course. With a handful of MCP servers you would fill up an entire 1M context, just with tools.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="315" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="315" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<h3 id="modern-lazy-load-only-include-tool-name">Modern lazy-load: only include tool name</h3>
<img src="images/service/system/mcp/tool-definition.png" />
<h4 id="-149"></h4>
<p>Nowadays the full definition is typically <em>not included in the context</em>: only the tool name. That's referred to as <strong>Lazy Schema Loading</strong>.</p>
<p>This means that the tool name has to contain all the information that would make the LLM find it suitable to call to solve some problem. The MCP namespace is flat so the full name is &quot;agent-name&quot;, then &quot;mcp server name&quot;, then &quot;tool name&quot;, and it must not be longer than 64 characters.</p>
<p>That's why the LLM may sometimes miss a suitable tool: it may simply not conclude that your prompting match a certain tool name because the tool names are so compact. If you ask for &quot;the most popular pages on my Siteimprove sites&quot; then it's a strong match, but if you just talked about &quot;the top of those 1000 pages viwth most page views&quot; then it would match practically nothing in the tool name and the LLM would likely not notice that this tool was suitable to call.</p>
<p>By the way: this demo name is problematic as it is 68 characters, so it should be shortened.</p>
<p>Links:<br />
<a href="https://modelcontextprotocol.io/seps/986-specify-format-for-tool-names">SEP-986: Specify Format for Tool Names</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="316" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="316" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<h3 id="20-tokens-instead-of-full-500-tokens">20 tokens instead of full 500 tokens</h3>
<img src="images/service/system/mcp/token-length.png" />
<h4 id="-150"></h4>
<p>So nowadays, don't worry about adding MCP servers. But also be aware that you may have to be more deliberate and precise in how you phrase your prompts so the LLM has a chance to match it up against the MCP tool names. For instance, say &quot;using thew atlassian ....&quot;</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="317" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="317" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<h3 id="911-project-instructions">#9/11: Project instructions</h3>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="318" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="318" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<h3 id="most-agents-offer-projects">Most agents offer &quot;projects&quot;</h3>
<img src="images/service/system/projects/project-windows-to-linux.png" />
<h4 id="-151"></h4>
<p>You can write instructions that is included in every chat related to a specific project or work that you're doing.</p>
<p>They go by many names: Projects, Gems, Custom GPTs, Spaces.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="319" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="319" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<h3 id="1011-global-custom-instructions">#10/11: Global custom instructions</h3>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="320" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="320" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<h3 id="customize-your-web-agent">Customize your web agent</h3>
<img src="images/service/system/customize/all-agents.png" />
<h4 id="-152"></h4>
<p>In all agents, you can add custom instructions that are included in every chat.</p>
<p>it could be your preference for how the AI should talk or act.</p>
<p>If there's something in general about the agents behavior that you'd like to change then this is the place. For instance, I have added this line to help me improve my spelling:</p>
<p>&quot;Silently ignore casual typos; gently flag systemic spelling blind spots as an aside.&quot;</p>
</section>

<h4 id="-156"></h4>
<p>You're likely almost tired of me repeating &quot;it's just more instructions to put into the system prompt&quot;. But agent-files are just that: the exact equivalent of custom (or project) instructions, only for the AI agents you run in the terminal.</p>

<ul>
<li data-marpit-fragment="1">Agents used different names: <code>CLAUDE.md</code>, <code>GEMINI.md</code>, even <code>AGENT.md</code> (no s)</li>

<h3 id="at-the-end-of-the-day-its-all-just-text">At the end of the day, it's all just text</h3>
<img src="images/service/system/shoveling.png" />
<h4 id="-160"></h4>
<p>The reason for showing you these snippets is to hammer in this fact:</p>
<p>At the end of the day, the &quot;system prompt&quot; is all just text. Words competing for the LLM's attention, having more or less authority, and filled with hints about how to bring in more context (tools, mcp, skills).</p>
<p>Yeah, you'll see some tags and markup, but that <em>markup is not rigorous rules</em>. The markup just convey some kind of structure. You or the agent could have chosen different tag-names, or written it in plain markdown with <code>##</code> headings, or used markdown bullet points, or HTML, etc. The exact formatting matters very little to the LLM, but the LLM does appreciate <em>the structure</em> it brings, just like human readers would.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="339" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="339" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<h3 id="every-token-influence-all-others---its-just-math">Every token influence all others - it's just math</h3>
<img src="images/llm/attention-space-seek.png" />
<h4 id="-161"></h4>
<p>Remember, the LLM is pure math. No &quot;LLM code&quot; will deliberately demand the text <code>&lt;skills&gt;</code> to appear in order to recognize the list of skills. It may help, but it's not required.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="340" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="340" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="341" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="341" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<h3 id="still-a-few-blank-spots">Still a few blank spots</h3>
<img src="images/service/overview/full-except-misc.png" />
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="342" data-marpit-fragments="4" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="342" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">
<h3 id="the-final-parts">The final parts</h3>
<img src="images/service/overview/misc.png" />
<h4 id="-162"></h4>
<p>Four parts to mention:</p>
<ul>
<li data-marpit-fragment="1">In addition to the text context, the request also does send along <em>some real hard parameters</em>: the <strong>model</strong>, the <strong>temperature</strong>, the <strong>thinking budget</strong> in tokens, and some other model-specific bits. In particular, the <em>temperature</em> adjusts the sampling of the next produced token: at temperature 0 the LLM will always pick the most probable next word. In pactice that leads to a weirdly clinical and un-appealing output. Higher temperature simply mean increased likelihood of choosing some of the less probably next tokens. Note though, that even for temperature 0 the LLM simply cannot guarantee it will produce the same output from the same input twice, because the hardware-parallelity in the GPU's matrix-calculations can vary and lead to minute floating-point-differences from one session to another.</li>
<li data-marpit-fragment="2">There are <strong>safety classifiers</strong> for content going in or coming out, that act as hard stops for inappropriate content. So even if you do somehow convince the LLM to produce a recipe for biochemical weapon that output will suffer a hard veto at the exit.</li>
<li data-marpit-fragment="3">The output usually contains <em>statistics</em> for number of tokens consumed and produced, among other things.</li>
<li data-marpit-fragment="4">And finally, <strong>the KV-cache</strong>. The AI Service and LLM knows nothing about you, but it does <em>cache</em> the calculations for a brief while. Nowadays it seem that 5 minutes is the common caching time. You simply <em>pay less</em> for the cached part, typically only 10%. So if you chat continuously and don't take more than 5 minute breaks then you'll save a lot of money. Wait 6 minutes and the cost is about 10x as high because the entire context has to be re-processed. In relation to that, the agent can set up to four explicit <em>cache markers</em>.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="343" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="343" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">

<h3 id="main-ai-service-takeaways">Main AI service takeaways</h3>
<ul>
<li data-marpit-fragment="1">It's all just text, competeting for attention<br />
 </li>
<li data-marpit-fragment="2">Adding stuff to the context is expensive so the tooling does its best to add as little as possible.<br />
 </li>
<li data-marpit-fragment="3">Adding <em>barely enough hints of useful info</em> for the LLM is the challenge, and the approaches are constantly evolving</li>
</ul>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="350" data-paginate="true" data-heading-divider="3" data-theme="i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe" lang="POSIX" data-marpit-pagination="350" style="--paginate:true;--heading-divider:3;--theme:i4p5eubtt21nn0nvys3ztq64f39idkwehem0li0vdfe;" data-marpit-pagination-total="374">

<p>Give the audience the three-layer shape — stated (you said it, it's stored verbatim), synthesized (periodic curated compression of what happened, regenerated wholesale, subject to recency decay), retrieved (opt-in search over raw history, triggered by cue-detection, scored by a real relevance mechanism). That structure is what's actually stable — it's the shape every vendor has converged on for the same token-economic reasons, independent of which embedding model or summarization prompt sits inside each box this quarter</p>

<p>&quot;Lost in the middle was real in 2023, is largely solved for simple retrieval in 2026, persists for complex tasks — and the reason it ever existed is still being worked out. so my suggestion is: stop worrying about the middle, and start worrying about the load. &quot;Keep your facts close and your context lean.&quot;</p>

<p>for most models, including the latest GPT and Gemini iterations, deeper reasoning actually lowers the success rate at detecting nonsense — the &quot;Reasoning Paradox.&quot; So the slide-safe version: CoT re-rolls the dice; it doesn't load them with truth.<br />
<a href="https://claude.ai/chat/a3c1720b-17f5-46b4-8f93-93b22926f713">https://claude.ai/chat/a3c1720b-17f5-46b4-8f93-93b22926f713</a><br />
The model doesn't know it's wrong when it hallucinates<br />
Developers expect that incorrect output means uncertain output — that the model would hedge or flag uncertainty. The model's confidence is calibrated to its training distribution, not to correctness. It can be completely wrong and completely confident simultaneously because plausibility and truth are different things.<br />
Halucination was trained to keep the conversation going, but not really so anymore.<br />

<h2 id="advice">Advice</h2>
<p>Give examples.</p>
<p>I use LLMs frequently to help build Excel tools and calculators, especially for budget management, both professionally and personally. I’ll often explain what I want it to do, all the parameters, etc. but then will end the prompt with, “Before you start building, let me know what questions or uncertainties you have, or what clarifications you need”.<br />
I often find that with whatever it responds with that I wasn’t clear enough with my initial explanation and request. A quick clarification on the front end helps save a lot of time from having it rebuild tools over and over due to my poor directions.</p>
<p>Be precise. Don't say &quot;it's green&quot; or &quot;it should not be green&quot;, but &quot;it should be red&quot;</p>
<p>Consider your prompts first-level source too, eligible to be committed.<br />
Deterministic vs pure AI-driven.</p>
